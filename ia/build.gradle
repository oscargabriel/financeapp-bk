plugins {
	id 'java-library'
}

// Sin project(':core'): lo que el asistente necesita del core lo pide por sus puertos de salida, y
// los adaptadores que los conectan viven en app (design.md de FA-148, decision 3).
dependencies {
	implementation project(':compartido')
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	testImplementation testFixtures(project(':compartido'))
}

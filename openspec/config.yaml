schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: backend de finanzas personales. Java 25, Spring Boot 4 WebFlux, R2DBC sobre PostgreSQL,
  arquitectura hexagonal. La guía completa —arquitectura, errores, validación, configuración,
  pruebas y despliegue— está en AGENTS.md, que ya está cargada en la sesión: no la releas ni la copies en los
  artefactos. Las specs se leen por sección (encabezados con grep -n, después el rango), no
  enteras. El contrato está en docs/api/, un archivo por recurso con contrato-api.md como índice:
  se lee el del recurso que toca la tarea, no la carpeta. Un endpoint que cambia actualiza en el
  mismo change el archivo de su recurso y su fila del índice.
  Las tareas vienen del proyecto FIN de Jira con clave FIN-n; el change se llama fin-<n>-<slug>.
  Las FA-n que aparecen en el código y en los changes archivados son del tablero anterior, en Notion.
  Toda ruta del API se pide con el prefijo /api, y todo error sale como
  {"errors":[{code, description, field}]} con el code tomado del enum ErrorCodes.
  La verificación tiene dos capas que se exigen juntas: gradlew build (JUnit con mocks, cobertura
  de línea >= 85 % y de rama >= 90 %) y bru run desde bruno/ contra la app y la base reales.

rules:
  proposal:
    - "Abre con el origen: la clave del issue (FIN-n), la de su epic y, si el encargo llegó por fuera del tablero, el texto o el resumen de cómo llegó."
    - "Nombra las decisiones de ## Decisiones del epic que el change aplica, con su fecha; lo que el epic deja en ## Fuera de alcance tampoco entra en el change."
    - Incluye una sección Fuera de alcance; lo que aparezca y no quepa en la tarea va a una tarea nueva del tablero, no a este change.
  specs:
    - "Las capacidades se nombran por recurso o área del sistema (auth, cuentas, categorias, transacciones, reportes, errores), no por la tarea."
    - Cada endpoint tocado lleva escenarios del camino feliz, de cada error de validación con su campo, y del 401 sin credencial o con la credencial de la otra cadena.
    - Los escenarios de error nombran el status HTTP, el code y el field esperados.
  design:
    - Créalo solo si la tarea toma una decisión con alternativas reales; cada decisión dice qué se descartó y por qué.
    - Si la decisión contradice algo de AGENTS.md, dilo explícitamente y propón el cambio a AGENTS.md como tarea del change.
  tasks:
    - "Cada tarea nombra cómo se verifica: la clase de test (y el método si aplica) o el request de bruno/ que la prueba."
    - "Cada tarea nombra los archivos y los métodos que crea o toca, con lo que la propuesta ya exploró: la implementación parte de ese mapa y no vuelve a explorar. Si dos clases parecidas se juntan, dice cuál se mueve con git mv."
    - El request de Bruno de un endpoint nuevo o cambiado va en el mismo grupo que el endpoint y se escribe antes, fallando.
    - "Si el change agrega o cambia un request de bruno/, una tarea lo replica en bruno-personal/ (ruta, cuerpo, autenticación) sin ejecutarlo: esa colección apunta a Neon y está fuera de git, así que el PR no muestra si se hizo."
    - "Indica en cada grupo qué skills de dominio cargar según la tabla Skills de dominio por grupo de tareas-jira (references/proponer.md: java-architect, java-exceptions, java-security, java-logging, java-debugging, bruno-cli). Un grupo que solo mueve, renombra o junta lo existente siguiendo una regla de AGENTS.md no nombra ninguna."
    - "El último grupo es de verificación: gradlew build y bru run . -r --env local, con los conteos reales."

operations:
  apply:
    guidance:
      - Antes de la primera tarea de cada grupo, carga solo las skills de dominio que ese grupo nombra en tasks.md.
      - Cada tarea se hace con TDD siguiendo java-testing; el test se ve fallar por la razón correcta antes de escribir el código.
      - No marques una tarea sin haber corrido su verificación; el último grupo exige gradlew build y bru run en verde.
      - "Ubica antes de leer: grep -n del símbolo y Read con offset y limit sobre ese rango. Nunca cat -n ni Get-Content de un archivo entero para mirar un método, ni releer completo un archivo que ya está en el contexto."
      - "Las ediciones independientes (el test, el DTO, el request, el contrato) van juntas en una sola respuesta. Edita con Edit, o con Write si reescribes la mayor parte del archivo; nunca con ReadAllText().Replace() de PowerShell, ni con sed o perl, que además cambian los finales de línea."
      - "Un archivo nuevo se escribe con un solo Write y se corrige con Edit. Para juntar clases parecidas: git mv de la más parecida y Edit, no Write desde cero. Para partir una clase: el bloque va con Write al archivo nuevo y sale del original con un Edit anclado en texto único; nunca recortes por índice de líneas."
      - "Corre los tests de la tarea filtrados con --tests y la salida recortada (Select-Object -Last 30). Los de tareas independientes del mismo grupo van en una sola corrida; no repitas una corrida sin cambiar nada entre medias."
      - "Marca las casillas de tasks.md con Edit en la misma respuesta que cierra el grupo, sin imprimir el archivo ni el status después."
      - "No agregues al commit cambios del working tree que no sean de la tarea: el usuario suele tener archivos propios sin commitear."
  archive:
    guidance:
      - Archiva en la misma rama de la tarea, antes de abrir el PR, para que el PR lleve juntos el código, la spec y el change archivado.
      - Si la delta toca una capacidad que una memoria de Claude describía, dilo al terminar para que esa memoria se borre.

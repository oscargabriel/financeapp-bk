plugins {
	id 'org.springframework.boot'
	id 'jacoco-report-aggregation'
}

dependencies {
	implementation project(':compartido')
	implementation project(':core')
	implementation project(':ia')
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	testImplementation testFixtures(project(':compartido'))
}

// El application.yaml de test vive en los test fixtures de compartido, pero en el classpath de test
// de app el jar de fixtures va despues de src/main/resources, y ganaria el yaml de Cloud Run.
// Copiarlo a los recursos de test lo pone primero, como antes de separar los modulos.
tasks.named('processTestResources', ProcessResources) {
	from(project(':compartido').file('src/testFixtures/resources')) {
		include 'application.yaml'
	}
}

// La cobertura se mide sobre los cuatro modulos juntos (design.md de FA-148, decision 8):
// compartido lo ejercitan sobre todo los tests de los demas, y medido solo con los suyos daria un
// numero que no dice nada.
//
// Lo que la suite no puede cubrir, y por tanto no cuenta para el umbral:
//   * el main, que no tiene forma de ejercitarse desde un test
//   * los adapters R2DBC de cualquier modulo, que desde el 12-09-2026 se verifican desde bruno/
//     contra PostgreSQL real
// El resto entra, DTOs y configuracion incluidos: excluirlos solo esconderia el dato.
def clasesSinCobertura = [
	'com/oscargabriel/financeapp/FinanceappBkApplication.class',
	'**/*R2dbcAdapter.class'
]

def clasesMedidas = { fileCollection ->
	files(fileCollection.files.collect { fileTree(dir: it, exclude: clasesSinCobertura) })
}

def reporteAgregado = tasks.named('testCodeCoverageReport', JacocoReport) {
	classDirectories.setFrom(clasesMedidas(classDirectories))
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('test') {
	finalizedBy reporteAgregado
}

def verificacionAgregada = tasks.register('testCodeCoverageVerification', JacocoCoverageVerification) {
	def reporte = reporteAgregado.get()
	dependsOn reporte
	executionData.from(reporte.executionData)
	classDirectories.from(reporte.classDirectories)
	sourceDirectories.from(reporte.sourceDirectories)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.85
			}
		}
	}
}

// Colgado de check, no de test: 'gradlew test' mide y deja el reporte, 'gradlew build' exige.
tasks.named('check') {
	dependsOn verificacionAgregada
}

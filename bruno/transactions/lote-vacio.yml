info:
  name: Lote vacio
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: "[]"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: body

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

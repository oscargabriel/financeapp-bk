info:
  name: Saldo — transferencia desde una cuenta sin saldo
  type: http
  seq: 58

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "TRANSFER",
          "accountId": "{{idNomina}}",
          "destinationAccountId": "{{idDestino}}",
          "amount": 120000,
          "description": "Al ahorro sin saldo"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        test("el error nombra la cuenta de origen", function() {
          const errores = res.getBody().errors;
          expect(errores).to.have.length(1);
          expect(errores[0].code).to.equal("INSUFFICIENT_FUNDS");
          expect(errores[0].field).to.equal("[0].amount");
          expect(errores[0].description).to.contain("Nómina");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

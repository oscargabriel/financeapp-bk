info:
  name: Multimoneda — ajustar el destino convertido
  type: http
  seq: 49

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idTransferenciaConvertida}}"
  body:
    type: json
    data: |-
      {
        "destinationAmount": 40000
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.destinationAmount
      operator: eq
      value: "40000"
    - expression: res.body.status
      operator: eq
      value: PENDING

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El monto real del destino, antes de aprobar

  La tasa interna dio 41000; el banco abono 40000. El PATCH lo corrige mientras sigue pendiente.

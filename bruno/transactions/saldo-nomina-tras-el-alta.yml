info:
  name: Saldo — los rechazos no movieron la cuenta
  type: http
  seq: 62

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Nómina queda en 30.000: solo cuenta el lote compensado", function() {
          const nomina = res.getBody().find(function (c) { return c.name === "Nómina"; });
          expect(nomina.currentBalance).to.equal(30000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

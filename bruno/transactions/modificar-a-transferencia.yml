info:
  name: Modificar a transferencia
  type: http
  seq: 25

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idFruta}}"
  body:
    type: json
    data: |-
      {
        "type": "TRANSFER",
        "destinationAccountId": "{{idDestino}}"
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.type
      operator: eq
      value: TRANSFER
    - expression: res.body.categoryId
      operator: isNull
  scripts:
    - type: tests
      code: |-
        test("lleva la cuenta destino enviada", function() {
          expect(res.getBody().destinationAccountId).to.equal(bru.getVar("idDestino"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Gasto a transferencia

  La categoria se vacia sola: el cliente no la manda en null.

info:
  name: Modificar con parche vacio
  type: http
  seq: 23

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idFruta}}"
  body:
    type: json
    data: |-
      {
        "description": null
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: body

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Ningun campo modificable

  `null` significa "no cambia", asi que un cuerpo con todo en null equivale a `{}`.

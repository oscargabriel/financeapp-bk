info:
  name: Modificar a transferencia sin destino
  type: http
  seq: 24

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idFruta}}"
  body:
    type: json
    data: |-
      {
        "type": "TRANSFER"
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].field
      operator: eq
      value: destinationAccountId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Las reglas se miran sobre el movimiento resultante

  El gasto no tiene cuenta destino; al volverse transferencia la necesita.

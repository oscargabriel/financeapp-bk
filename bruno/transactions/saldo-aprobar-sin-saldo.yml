info:
  name: Saldo — aprobar un pendiente sin saldo
  type: http
  seq: 68

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteNomina}}/approve"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        test("un solo INSUFFICIENT_FUNDS en amount", function() {
          expect(res.getBody().errors).to.eql([{
            code: "INSUFFICIENT_FUNDS",
            description: "Saldo insuficiente en Nómina: quedaría en -380000 COP",
            field: "amount"
          }]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

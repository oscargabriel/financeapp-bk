info:
  name: Usuario de transacciones — alta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailTransacciones}}",
        "password": "{{claveTransacciones}}",
        "firstName": "Carga",
        "lastName": "Lotes",
        "baseCurrencyCode": "COP",
        "timezone": "America/Bogota"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailTransacciones", "transacciones-" + Date.now() + "@bruno.local");
        bru.setVar("claveTransacciones", "unaClaveLarga");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Alta del usuario de la carpeta

  El registro le copia las 22 categorias por defecto, que son las que usan los lotes.

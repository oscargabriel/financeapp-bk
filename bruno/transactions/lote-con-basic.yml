info:
  name: Lote con Basic
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: "[]"
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # POST /api/transactions con la credencial compartida

  El Basic abre `/auth/*` y `/status`, no el alta: tiene que dar 401 con el reto de la cadena del
  JWT, sin llegar a validar el cuerpo.

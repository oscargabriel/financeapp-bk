info:
  name: Eliminar movimiento ajeno
  type: http
  seq: 32

http:
  method: DELETE
  url: "{{baseUrl}}/transactions/{{idFruta}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El movimiento es de otro usuario

  Va antes de `Eliminar`: si borrara, ese request daria 404 en vez de 204.

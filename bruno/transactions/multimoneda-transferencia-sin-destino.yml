info:
  name: Multimoneda — transferencia sin monto de destino
  type: http
  seq: 44

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "TRANSFER",
          "accountId": "{{idUsd}}",
          "destinationAccountId": "{{idOrigen}}",
          "amount": 10,
          "description": "Venta de dolares"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        const t = res.getBody()[0];
        bru.setVar("idTransferenciaConvertida", t.id);

        test("el destino se calcula con la tasa de hoy y queda pendiente", function() {
          expect(t.currencyCode).to.equal("USD");
          expect(t.amount).to.equal(10);
          expect(t.destinationAmount).to.equal(41000);
          expect(t.status).to.equal("PENDING");
          expect(t.originalAmount).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

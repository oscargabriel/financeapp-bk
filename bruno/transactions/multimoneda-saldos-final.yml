info:
  name: Multimoneda — saldos al final
  type: http
  seq: 55

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("USD: 1000 - 25 del gasto - 10 de la venta aprobada; la compra paso a ser gasto de Efectivo", function() {
          expect(saldo("Dolares")).to.equal(965);
        });

        test("Efectivo: - 410000 de la compra, ahora gasto, + 40000 de la venta aprobada", function() {
          expect(saldo("Efectivo")).to.equal(Number(bru.getVar("saldoEfectivoAntesMultimoneda")) - 410000 + 40000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

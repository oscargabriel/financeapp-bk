info:
  name: Saldos tras eliminar
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("el origen recupera el gasto original", function() {
          // la foto incluia el gasto de 30.000,5 que ya no existe
          expect(saldo("Efectivo")).to.equal(Number(bru.getVar("saldoOrigenAntes")) + 30000.5);
        });

        test("el destino queda como estaba, tras ir y volver de la transferencia", function() {
          expect(saldo("Ahorros")).to.equal(Number(bru.getVar("saldoDestinoAntes")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Como si el movimiento no se hubiera registrado

  Entre la foto y aqui el movimiento cambio de monto, paso a transferencia y volvio a gasto: los
  saldos tienen que haber deshecho todo eso.

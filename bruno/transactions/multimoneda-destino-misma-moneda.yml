info:
  name: Multimoneda — monto de destino entre cuentas de la misma moneda
  type: http
  seq: 45

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "TRANSFER",
          "accountId": "{{idOrigen}}",
          "destinationAccountId": "{{idDestino}}",
          "amount": 1000,
          "destinationAmount": 1000,
          "description": "Entre pesos"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("el error va en el monto de destino del elemento", function() {
          const errores = res.getBody().errors;
          expect(errores.map(function (e) { return e.field; })).to.eql(["[0].destinationAmount"]);
          expect(errores[0].code).to.equal("VALIDATION_ERROR");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

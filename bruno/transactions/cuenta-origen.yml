info:
  name: Cuenta origen
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/accounts"
  body:
    type: json
    data: |-
      {
        "name": "Efectivo",
        "type": "CASH",
        "currencyCode": "COP",
        "initialBalance": 1000000
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idOrigen", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

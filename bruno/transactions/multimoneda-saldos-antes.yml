info:
  name: Multimoneda — saldos antes
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const efectivo = res.getBody().find(function (c) { return c.name === "Efectivo"; });
        bru.setVar("saldoEfectivoAntesMultimoneda", efectivo.currentBalance);

        test("la cuenta en USD arranca con su saldo inicial", function() {
          const usd = res.getBody().find(function (c) { return c.name === "Dolares"; });
          expect(usd.currencyCode).to.equal("USD");
          expect(usd.currentBalance).to.equal(1000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

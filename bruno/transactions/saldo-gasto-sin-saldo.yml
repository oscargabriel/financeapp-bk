info:
  name: Saldo — gasto mayor que el saldo
  type: http
  seq: 57

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idNomina}}",
          "categoryId": "{{idMercado}}",
          "amount": 150000,
          "description": "Mercado sin saldo"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        test("un solo INSUFFICIENT_FUNDS en el monto, con un texto para el usuario", function() {
          expect(res.getBody().errors).to.eql([{
            code: "INSUFFICIENT_FUNDS",
            description: "Saldo insuficiente en Nómina: quedaría en -50000 COP",
            field: "[0].amount"
          }]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Saldos antes de modificar
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        bru.setVar("saldoOrigenAntes", String(saldo("Efectivo")));
        bru.setVar("saldoDestinoAntes", String(saldo("Ahorros")));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Foto de los saldos antes de modificar

  `Lote sin fecha` ya movio Efectivo despues de `Saldos tras el alta`, asi que las comprobaciones
  de modificar y eliminar se miden contra esta foto y no contra aquella.

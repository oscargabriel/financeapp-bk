info:
  name: Modificar con cuenta ajena
  type: http
  seq: 21

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idFruta}}"
  body:
    type: json
    data: |-
      {
        "accountId": "20000000-0000-7000-8000-000000000001"
      }
  auth:
    type: bearer
    token: "{{tokenTransacciones}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: accountId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La cuenta existe, pero es de otro usuario

  `Efectivo` del usuario de `test-data.sql`. Mismo mensaje que una cuenta inexistente, como en el
  alta. Sin indice en el campo: el cuerpo es un objeto, no un lote.

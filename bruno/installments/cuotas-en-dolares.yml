info:
  name: Las cuotas en dolares en el reporte
  type: http
  seq: 70

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeCuotas}}&to={{hastaCuotas}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuotas = res.getBody().transactions
            .filter(function (t) { return t.installment && t.installment.purchaseId === bru.getVar("idCompraUsd"); })
            .sort(function (a, b) { return a.installment.number - b.installment.number; });

        test("son tres gastos en dolares de la tarjeta", function() {
          expect(cuotas).to.have.length(3);
          cuotas.forEach(function (t) {
            expect(t.accountId).to.equal(bru.getVar("idVisaUsd"));
            expect(t.currencyCode).to.equal("USD");
          });
          expect(cuotas.map(function (t) { return t.amount; })).to.eql([35.33, 34.66, 34.01]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Cancelar dos veces
  type: http
  seq: 47

http:
  method: DELETE
  url: "{{baseUrl}}/installment-purchases/{{idCompraPasada}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Editar con una categoria de ingresos
  type: http
  seq: 40

http:
  method: PATCH
  url: "{{baseUrl}}/installment-purchases/{{idCompraPasada}}"
  body:
    type: json
    data: |-
      {
        "scope": "ALL",
        "categoryId": "{{idSalarioCuotas}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("la categoria tiene que admitir gastos", function() {
          const campos = res.getBody().errors.map(function (e) { return e.field; });
          expect(campos).to.include("categoryId");
          res.getBody().errors.forEach(function (e) { expect(e.code).to.equal("VALIDATION_ERROR"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

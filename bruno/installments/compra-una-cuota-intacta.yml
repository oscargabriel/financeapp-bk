info:
  name: La compra a una cuota conserva su interes
  type: http
  seq: 60

http:
  method: GET
  url: "{{baseUrl}}/installment-purchases"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("quitar la opcion no recalcula la compra ya registrada", function() {
          const compra = res.getBody().find(function (p) { return p.id === bru.getVar("idCompraUnaConInteres"); });
          expect(compra).to.not.equal(undefined);
          expect(compra.remainingPrincipal).to.equal(300000);
          expect(compra.remainingAmount).to.equal(306000);
          expect(compra.nextInstallment.amount).to.equal(306000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

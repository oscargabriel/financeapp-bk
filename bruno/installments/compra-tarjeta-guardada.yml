info:
  name: La compra de la tarjeta desactivada sigue activa
  type: http
  seq: 72

http:
  method: GET
  url: "{{baseUrl}}/installment-purchases"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const bicicleta = res.getBody().find(function (p) { return p.id === bru.getVar("idCompraGuardada"); });

        test("la cuota vencida cuenta como pagada", function() {
          expect(bicicleta.accountId).to.equal(bru.getVar("idVisaGuardada"));
          expect(bicicleta.paidCount).to.equal(1);
          expect(bicicleta.remainingPrincipal).to.equal(200000);
          expect(bicicleta.remainingAmount).to.equal(200000);
          expect(bicicleta.nextInstallment.number).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

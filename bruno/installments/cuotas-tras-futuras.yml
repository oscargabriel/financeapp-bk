info:
  name: Cuotas tras editar las futuras
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeCuotas}}&to={{hastaCuotas}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuotas = res.getBody().transactions
            .filter(function (t) { return t.installment && t.installment.purchaseId === bru.getVar("idCompraPasada"); })
            .sort(function (a, b) { return a.installment.number - b.installment.number; });

        test("las futuras cambian y las pasadas no", function() {
          cuotas.forEach(function (t) {
            expect(t.description).to.equal(t.scheduled ? "Nevera cocina" : "Nevera");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: La compra sigue tras el borrado rechazado
  type: http
  seq: 63

http:
  method: GET
  url: "{{baseUrl}}/installment-purchases"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("el borrado rechazado no toco la compra", function() {
          const ids = res.getBody().map(function (p) { return p.id; });
          expect(ids).to.include(bru.getVar("idCompraUnaConInteres"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

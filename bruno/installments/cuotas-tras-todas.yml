info:
  name: Cuotas tras editar todas
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeCuotas}}&to={{hastaCuotas}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuotas = res.getBody().transactions
            .filter(function (t) { return t.installment && t.installment.purchaseId === bru.getVar("idCompraPasada"); })
            .sort(function (a, b) { return a.installment.number - b.installment.number; });

        test("todas pasan a la categoria nueva", function() {
          expect(cuotas).to.have.length(5);
          cuotas.forEach(function (t) { expect(t.categoryId).to.equal(bru.getVar("idMercadoCuotas")); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

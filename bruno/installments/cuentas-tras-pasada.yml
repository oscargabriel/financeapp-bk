info:
  name: Cuentas tras la compra pasada
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const visa = res.getBody().find(function (c) { return c.id === bru.getVar("idVisa"); });
        const pagadas = Number(bru.getVar("pagadasPasada"));
        const pagado = Number(bru.getVar("pagadoPasada"));
        const comprometido = 1200000 + 300000 + 100000 * (6 - pagadas);
        bru.setVar("cupoAntesDeBorrar", String(5000000 - pagado - comprometido));

        test("las cuotas vencidas entran al saldo", function() {
          expect(visa.currentBalance).to.equal(-pagado);
        });

        test("el cupo descuenta el saldo y el capital de todas las cuotas por venir", function() {
          expect(visa.availableCredit).to.equal(5000000 - pagado - comprometido);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Compras en cuotas (FA-108)

  Corre con el usuario `cuotas@financeapp.local` que siembra `docs/database/test-data.sql`, con su
  token en `tokenCuotas`. Es un usuario aparte porque registrar compras mueve saldos y cupos.

  **Necesita `test-data.sql` recién cargado**: las compras se registran en cada corrida y los cupos
  que verifica parten de cero. `verificar-bruno.ps1 -RecargarDatos` recarga antes de cada corrida.

  Lo sembrado, todo en COP y con saldo 0: `Visa` (cupo 5.000.000, corte 20, pago 5, tasa 2),
  `Visa 31` (cupo 2.000.000, corte y pago 31, sin tasa), `Visa sin corte` y `Ahorros`. La compra
  ajena es de `prueba@`, sin cuotas, solo para los 404.

  Ademas (FIN-41), `Visa guardada`, desactivada, con la compra `Bicicleta` a 3 cuotas de 100.000: la
  primera vencio ayer. Es la unica forma de ver una cuota vencer con la tarjeta desactivada.

  Al final de la carpeta (FA-134) se crea `Visa una cuota`, igual que `Visa` pero con
  `chargesSingleInstallmentInterest` en `true`: ahi se prueba el interes de una compra a 1 cuota, y
  que quitar la opcion no recalcula la compra ya registrada.

  Despues (FA-123) se crean `Visa USD`, igual que `Visa` pero en dolares, y `Visa USD sin tasa`:
  ahi se prueba el redondeo a centavos y el minimo de un centavo de capital por cuota.

  Las cuotas se leen de `reports/transactions` filtradas por `installment.purchaseId`, y cada una
  vence a medianoche de Bogotá: `T05:00:00Z`.

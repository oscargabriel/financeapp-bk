info:
  name: Cuentas tras la compra
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const visa = res.getBody().find(function (c) { return c.id === bru.getVar("idVisa"); });

        test("el saldo no cambia y el cupo baja por el total", function() {
          expect(visa.currentBalance).to.equal(0);
          expect(visa.availableCredit).to.equal(3800000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Cuentas tras simular
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const visa = res.getBody().find(function (c) { return c.id === bru.getVar("idVisa"); });

        test("simular no mueve el saldo ni el cupo", function() {
          expect(visa.currentBalance).to.equal(0);
          expect(visa.availableCredit).to.equal(5000000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

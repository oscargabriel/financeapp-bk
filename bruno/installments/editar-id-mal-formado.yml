info:
  name: Editar con un id mal formado
  type: http
  seq: 42

http:
  method: PATCH
  url: "{{baseUrl}}/installment-purchases/no-es-uuid"
  body:
    type: json
    data: |-
      {
        "scope": "ALL",
        "description": "TV"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

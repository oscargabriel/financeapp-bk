info:
  name: Saldos tras editar todas
  type: http
  seq: 44

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuenta = res.getBody().find(function (c) { return c.id === bru.getVar("idCuentaSeries"); });

        test("la pasada pasa de 30000 a 35000", function() {
          expect(cuenta.currentBalance).to.equal(Number(bru.getVar("saldoSeriesAntes")) - 5000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

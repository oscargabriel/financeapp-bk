info:
  name: Saldos tras editar las futuras
  type: http
  seq: 42

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuenta = res.getBody().find(function (c) { return c.id === bru.getVar("idCuentaSeries"); });

        test("las futuras no cuentan: el saldo no cambia", function() {
          expect(cuenta.currentBalance).to.equal(Number(bru.getVar("saldoSeriesAntes")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

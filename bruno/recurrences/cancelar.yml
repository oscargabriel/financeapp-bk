info:
  name: Cancelar la serie editada
  type: http
  seq: 56

http:
  method: DELETE
  url: "{{baseUrl}}/recurrences/{{idSerieEditar}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Alta con interval 0
  type: http
  seq: 27

http:
  method: POST
  url: "{{baseUrl}}/recurrences"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "accountId": "{{idCuentaSeries}}",
        "categoryId": "{{idSuscripcionesSeries}}",
        "amount": 10000,
        "description": "Serie inválida",
        "frequency": "MONTHLY",
        "interval": 0,
        "dayOfMonth": 5,
        "startDate": "{{mananaSeries}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("un intervalo menor que 1 es error sobre interval", function() {
          const campos = res.getBody().errors.map(function (e) { return e.field; });
          expect(campos).to.include("interval");
          res.getBody().errors.forEach(function (e) { expect(e.code).to.equal("VALIDATION_ERROR"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

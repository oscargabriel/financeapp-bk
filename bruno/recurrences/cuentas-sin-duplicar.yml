info:
  name: Cuentas otra vez, sin duplicar
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuenta = res.getBody().find(function (c) { return c.id === bru.getVar("idCuentaAtrasada"); });

        test("una segunda lectura no crea nada mas", function() {
          expect(cuenta.currentBalance).to.equal(1000000 - 4 * 10000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

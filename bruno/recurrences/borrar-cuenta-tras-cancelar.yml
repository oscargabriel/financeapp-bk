info:
  name: Borrar la cuenta tras cancelar su serie
  type: http
  seq: 90

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/{{idDesactivable}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Desactivada, en cero, sin programados ni series activas: se borra.

info:
  name: Cancelar la serie de otro usuario
  type: http
  seq: 60

http:
  method: DELETE
  url: "{{baseUrl}}/recurrences/{{idSerieAjena}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

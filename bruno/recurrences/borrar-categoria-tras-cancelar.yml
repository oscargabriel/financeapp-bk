info:
  name: Borrar la categoria tras cancelar su serie
  type: http
  seq: 89

http:
  method: DELETE
  url: "{{baseUrl}}/categories/{{idClub}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

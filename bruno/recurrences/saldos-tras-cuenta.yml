info:
  name: Saldos tras cambiar la cuenta
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (v) {
          return res.getBody().find(function (c) { return c.id === bru.getVar(v); }).currentBalance;
        };

        test("la pasada sale de la cuenta anterior y entra en la nueva", function() {
          expect(saldo("idCuentaSeries")).to.equal(Number(bru.getVar("saldoSeriesAntes")) - 5000 + 35000);
          expect(saldo("idCuentaSeriesOtra")).to.equal(Number(bru.getVar("saldoOtraAntes")) - 35000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

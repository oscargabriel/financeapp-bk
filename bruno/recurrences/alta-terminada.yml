info:
  name: Alta de una serie que ya termino
  type: http
  seq: 36

http:
  method: POST
  url: "{{baseUrl}}/recurrences"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "accountId": "{{idCuentaSeries}}",
        "categoryId": "{{idSuscripcionesSeries}}",
        "amount": 4000,
        "description": "Ya terminada",
        "frequency": "MONTHLY",
        "dayOfMonth": 1,
        "startDate": "{{primeroMes0}}",
        "occurrences": 2
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idSerieTerminada", res.getBody().id);

        test("una serie sin ocurrencias por venir no tiene proxima", function() {
          expect(res.getBody().nextOccurrenceAt).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

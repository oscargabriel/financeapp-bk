info:
  name: Listado tras cancelar
  type: http
  seq: 58

http:
  method: GET
  url: "{{baseUrl}}/recurrences"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("la cancelada ya no aparece", function() {
          const ids = res.getBody().map(function (s) { return s.id; });
          expect(ids).to.not.include(bru.getVar("idSerieEditar"));
          expect(ids).to.include(bru.getVar("idSerieMensual"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

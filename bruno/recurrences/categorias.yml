info:
  name: Categorias del usuario
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const buscar = function (n) { return res.getBody().find(function (c) { return c.name === n; }).id; };
        bru.setVar("idSuscripcionesSeries", buscar("Suscripciones"));
        bru.setVar("idSalarioSeries", buscar("Salario"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

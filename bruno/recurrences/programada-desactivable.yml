info:
  name: Ocurrencia programada de la serie de Desactivable
  type: http
  seq: 84

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeSeries}}&to={{hastaSeries}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const ocurrencias = res.getBody().transactions
            .filter(function (t) { return t.recurrenceId === bru.getVar("idSerieDesactivable"); });

        test("la serie tiene una sola ocurrencia, programada", function() {
          expect(ocurrencias).to.have.length(1);
          expect(ocurrencias[0].scheduled).to.equal(true);
        });

        bru.setVar("idProgramadaDesactivable", ocurrencias[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

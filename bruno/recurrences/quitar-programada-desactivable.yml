info:
  name: Borrar a mano la programada de Desactivable
  type: http
  seq: 85

http:
  method: DELETE
  url: "{{baseUrl}}/transactions/{{idProgramadaDesactivable}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Deja la cuenta sin programados pero con la serie activa: es el hueco que FA-115 dejaba abierto.

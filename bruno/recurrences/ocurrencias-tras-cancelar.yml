info:
  name: Ocurrencias tras cancelar
  type: http
  seq: 57

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeSeries}}&to={{hastaSeries}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const ocurrencias = res.getBody().transactions
            .filter(function (t) { return t.recurrenceId === bru.getVar("idSerieEditar"); })
            .sort(function (a, b) { return a.occurredAt < b.occurredAt ? -1 : 1; });
        const fechas = ocurrencias.map(function (t) { return t.occurredAt; });

        test("solo queda la pasada, con su serie", function() {
          expect(ocurrencias).to.have.length(1);
          expect(ocurrencias[0].scheduled).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

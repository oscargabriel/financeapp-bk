info:
  name: Alta de la serie que cambia de periodicidad
  type: http
  seq: 47

http:
  method: POST
  url: "{{baseUrl}}/recurrences"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "accountId": "{{idCuentaSeries}}",
        "categoryId": "{{idSuscripcionesSeries}}",
        "amount": 20000,
        "description": "Cambia de regla",
        "frequency": "MONTHLY",
        "dayOfMonth": 1,
        "startDate": "{{primeroMes2}}",
        "occurrences": 6
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idSeriePeriodicidad", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

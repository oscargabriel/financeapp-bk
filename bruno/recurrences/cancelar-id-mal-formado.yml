info:
  name: Cancelar con un id mal formado
  type: http
  seq: 61

http:
  method: DELETE
  url: "{{baseUrl}}/recurrences/no-es-uuid"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Alta con el fin antes del inicio
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseUrl}}/recurrences"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "accountId": "{{idCuentaSeries}}",
        "categoryId": "{{idSuscripcionesSeries}}",
        "amount": 10000,
        "description": "Serie inválida",
        "frequency": "MONTHLY",
        "interval": 1,
        "dayOfMonth": 5,
        "startDate": "{{mananaSeries}}",
        "endDate": "{{ayerSeries}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("un fin anterior al inicio es error sobre endDate", function() {
          const campos = res.getBody().errors.map(function (e) { return e.field; });
          expect(campos).to.include("endDate");
          res.getBody().errors.forEach(function (e) { expect(e.code).to.equal("VALIDATION_ERROR"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

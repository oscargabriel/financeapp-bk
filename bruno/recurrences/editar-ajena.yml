info:
  name: Editar la serie de otro usuario
  type: http
  seq: 54

http:
  method: PATCH
  url: "{{baseUrl}}/recurrences/{{idSerieAjena}}"
  body:
    type: json
    data: |-
      {
        "scope": "ALL",
        "amount": 1
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

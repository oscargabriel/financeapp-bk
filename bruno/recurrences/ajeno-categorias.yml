info:
  name: Usuario ajeno — categorias
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{tokenAjenoSeries}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idSuscripcionesAjena", res.getBody().find(function (c) { return c.name === "Suscripciones"; }).id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

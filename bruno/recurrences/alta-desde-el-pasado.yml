info:
  name: Alta que empezo hace dos meses
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/recurrences"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "accountId": "{{idCuentaSeries}}",
        "categoryId": "{{idSuscripcionesSeries}}",
        "amount": 30000,
        "description": "Desde el pasado",
        "frequency": "MONTHLY",
        "dayOfMonth": 1,
        "startDate": "{{primeroMes1}}",
        "occurrences": 3
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idSerieDesdePasado", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Desactivar la cuenta tras cancelar su serie
  type: http
  seq: 88

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idDesactivable}}"
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isActive
      operator: eq
      value: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

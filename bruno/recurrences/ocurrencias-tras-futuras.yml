info:
  name: Ocurrencias tras editar las futuras
  type: http
  seq: 41

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{desdeSeries}}&to={{hastaSeries}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const ocurrencias = res.getBody().transactions
            .filter(function (t) { return t.recurrenceId === bru.getVar("idSerieEditar"); })
            .sort(function (a, b) { return a.occurredAt < b.occurredAt ? -1 : 1; });
        const fechas = ocurrencias.map(function (t) { return t.occurredAt; });

        test("la pasada conserva el monto y las futuras cambian", function() {
          expect(ocurrencias.map(function (t) { return t.amount; })).to.eql([30000, 35000, 35000]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

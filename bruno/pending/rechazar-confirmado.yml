info:
  name: Rechazar un confirmado
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteGasto}}/reject"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: status

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Rechazar no borra un confirmado

  Para borrar un movimiento confirmado está `DELETE /api/transactions/{id}`.

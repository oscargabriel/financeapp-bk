info:
  name: Pendientes con desactivadas
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "3"
  scripts:
    - type: tests
      code: |-
        test("el gasto, la transferencia y el de correo siguen pendientes", function() {
          const ids = res.getBody().map(function (t) { return t.id; });
          expect(ids).to.have.members([bru.getVar("idPendienteGasto"), bru.getVar("idPendienteTraslado"),
              bru.getVar("idPendienteCorreo")]);
          res.getBody().forEach(function (t) { expect(t.status).to.equal("PENDING"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Los 409 no tocaron nada

  Los dos que no se pudieron aprobar siguen ahí, igual que el de correo, que no se toca hasta el
  final; el rechazado ya no.

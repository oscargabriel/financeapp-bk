info:
  name: Saldos con desactivadas
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/accounts?includeInactive=true"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("las aprobaciones rechazadas no movieron saldos", function() {
          expect(saldo("Cuenta pendientes")).to.equal(970000);
          expect(saldo("Bolsillo pendientes")).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Con `includeInactive=true`

  Sin ese parámetro las dos cuentas desactivadas no salen en la lista.

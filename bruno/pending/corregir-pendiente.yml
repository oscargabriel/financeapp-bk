info:
  name: Corregir pendiente
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idPendienteGasto}}"
  body:
    type: json
    data: |-
      {
        "amount": 50000
      }
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.amount
      operator: eq
      value: "50000"
    - expression: res.body.status
      operator: eq
      value: PENDING

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un pendiente se corrige antes de aprobarlo

  Sigue pendiente después del PATCH, y el saldo no cambia: lo comprueba el request siguiente.

info:
  name: Saldos tras rechazar
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("rechazar no deja rastro en los saldos", function() {
          expect(saldo("Cuenta pendientes")).to.equal(820000);
          expect(saldo("Bolsillo pendientes")).to.equal(100000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

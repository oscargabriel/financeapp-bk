info:
  name: Aprobar pendiente ajeno
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteGasto}}/approve"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El pendiente es de otro usuario

  Con el token de `prueba@`. Va antes de aprobarlo: después daría 409 por estar confirmado, y
  entonces revelaría que el id existe. `Corregir pendiente` comprueba de paso que sigue pendiente.

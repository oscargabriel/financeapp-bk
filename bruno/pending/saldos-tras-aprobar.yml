info:
  name: Saldos tras aprobar
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("la cuenta descuenta el gasto corregido y la transferencia", function() {
          // 970.000 - 50.000 - 100.000
          expect(saldo("Cuenta pendientes")).to.equal(820000);
        });

        test("el bolsillo recibe la transferencia", function() {
          expect(saldo("Bolsillo pendientes")).to.equal(100000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

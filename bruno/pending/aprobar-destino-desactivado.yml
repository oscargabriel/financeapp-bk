info:
  name: Aprobar con el destino desactivado
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteTraslado}}/approve"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: destinationAccountId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo el destino está desactivado

  El origen sigue activo, así que el único error es el del destino. "Saldos con desactivadas"
  comprueba que ninguna de las dos cuentas se movió.

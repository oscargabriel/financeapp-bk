info:
  name: Listar pendientes
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "4"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();

        test("devuelve el contrato del movimiento, con su estado y su origen", function() {
          expect(lista[0]).to.have.all.keys("id", "type", "accountId", "destinationAccountId",
              "categoryId", "amount", "currencyCode", "description", "notes", "occurredAt", "status",
              "origin", "scheduled", "recurrenceId", "installment", "destinationAmount", "originalAmount",
              "originalCurrencyCode", "groupId", "sharedBy", "sharedFrom", "shares");
          lista.forEach(function (t) {
            expect(t.originalAmount).to.equal(null);
            expect(t.originalCurrencyCode).to.equal(null);
            expect(t.scheduled).to.equal(false);
            expect(t.recurrenceId).to.equal(null);
            expect(t.installment).to.equal(null);
          });
        });

        test("todos estan pendientes; los del asistente son TELEGRAM y el de correo EMAIL (FIN-101)", function() {
          lista.forEach(function (t) { expect(t.status).to.equal("PENDING"); });
          expect(lista.map(function (t) { return t.origin; }))
              .to.eql(["TELEGRAM", "TELEGRAM", "TELEGRAM", "EMAIL"]);
        });

        test("cada uno trae su grupo: la transferencia y el gasto entraron juntos (FIN-58)", function() {
          expect(lista[0].groupId).to.equal("71000000-0000-7000-8000-000000000001");
          expect(lista[1].groupId).to.equal("71000000-0000-7000-8000-000000000001");
          expect(lista[2].groupId).to.equal("71000000-0000-7000-8000-000000000002");
          expect(lista[3].groupId).to.equal("71000000-0000-7000-8000-000000000003");
        });

        test("del mas reciente al mas antiguo, sin el confirmado", function() {
          expect(lista.map(function (t) { return t.id; })).to.eql([
            bru.getVar("idPendienteGasto"),
            bru.getVar("idPendienteTraslado"),
            bru.getVar("idPendienteRechazo"),
            bru.getVar("idPendienteCorreo")
          ]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

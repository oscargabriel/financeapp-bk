info:
  name: Aprobar con el origen desactivado
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteGasto}}/approve"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: accountId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un gasto sobre una cuenta desactivada

  Aprobar no puede mover el saldo de una cuenta que el alta ya no acepta.

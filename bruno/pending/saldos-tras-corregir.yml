info:
  name: Saldos tras corregir
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("corregir un pendiente no mueve el saldo", function() {
          const cuenta = res.getBody().find(function (c) { return c.name === "Cuenta pendientes"; });
          expect(cuenta.currentBalance).to.equal(970000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

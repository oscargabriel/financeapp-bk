info:
  name: Desactivar bolsillo
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/20000000-0000-7000-8000-000000000008"
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isActive
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Abre la ventana de cuentas desactivadas (FA-102)

  `Bolsillo pendientes` es el destino de la transferencia pendiente. Hasta "Reactivar bolsillo" se
  prueba que aprobar rechaza una cuenta desactivada y que rechazar no la mira.

info:
  name: Reporte de movimientos sin los pendientes
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        const r = res.getBody();

        test("solo sale el gasto confirmado", function() {
          expect(r.transactions[0].description).to.equal("Mercado confirmado");
        });

        test("los totales no suman los pendientes", function() {
          expect(r.net).to.equal(-30000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

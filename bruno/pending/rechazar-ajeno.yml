info:
  name: Rechazar pendiente ajeno
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idPendienteGasto}}/reject"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El pendiente es de otro usuario

  Con el token de `prueba@`. Si lo borrara, `Corregir pendiente` daría 404.

info:
  name: Reporte de movimientos tras aprobar
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "3"
  scripts:
    - type: tests
      code: |-
        test("salen los dos aprobados y no el que sigue pendiente", function() {
          const ids = res.getBody().transactions.map(function (t) { return t.id; });
          expect(ids).to.include(bru.getVar("idPendienteGasto"));
          expect(ids).to.include(bru.getVar("idPendienteTraslado"));
          expect(ids).to.not.include(bru.getVar("idPendienteRechazo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

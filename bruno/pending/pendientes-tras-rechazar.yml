info:
  name: Pendientes tras rechazar
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: length
      value: "1"
    - expression: res.body[0].id
      operator: eq
      value: "{{idPendienteCorreo}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo queda el de correo

  Dos aprobados y uno rechazado. El pendiente de correo (FIN-101) se aprueba al final de la
  carpeta, para no mover los saldos y reportes que se verifican hasta aquí.

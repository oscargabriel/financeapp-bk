info:
  name: Aprobar un id inexistente
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/transactions/70000000-0000-7000-8000-0000000000ff/approve"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

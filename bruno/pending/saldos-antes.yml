info:
  name: Saldos antes de aprobar
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenPendientes}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const saldo = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).currentBalance;
        };

        test("solo el gasto confirmado mueve la cuenta", function() {
          expect(saldo("Cuenta pendientes")).to.equal(970000);
        });

        test("la transferencia pendiente no llega al bolsillo", function() {
          expect(saldo("Bolsillo pendientes")).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

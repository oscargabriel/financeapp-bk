info:
  name: Status fuera del base-path
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/status"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /status (sin /api)

  El API vive bajo `spring.webflux.base-path` (`/api`). Golpear la ruta sin el prefijo debe dar
  404: confirma que el base-path esta aplicando y que el controlador no quedo expuesto dos veces.

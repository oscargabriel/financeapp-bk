info:
  name: Status sin credenciales
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/status"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /api/status sin Authorization

  La ausencia de `http.auth` rompe a proposito la herencia de Basic Auth de la coleccion: un
  request sin esa clave se parsea como `mode: none`, que es lo que emite el propio
  serializador de Bruno. Escribir `auth: none` explicito funciona igual pero hace que el CLI
  imprima `toBrunoAuth failed: Unsupported auth type` en cada corrida. Ninguna ruta es
  publica (`SecurityConfig` usa `anyExchange().authenticated()`), asi que el status tambien exige
  credenciales. Si este request empieza a devolver 200, alguien abrio una ruta sin quererlo.

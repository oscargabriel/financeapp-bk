info:
  name: Usuario sin datos — alta
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailInicioSinDatos}}",
        "password": "unaClaveLarga",
        "firstName": "Inicio",
        "lastName": "Vacio",
        "baseCurrencyCode": "COP",
        "timezone": "America/Bogota"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        // Un correo por corrida: el alta no es idempotente. La limpieza vive en test-data.sql.
        bru.setVar("emailInicioSinDatos", "inicio-sin-datos-" + Date.now() + "@bruno.local");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Usuario sin datos — login
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailInicioSinDatos}}",
        "password": "unaClaveLarga"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("tokenInicioSinDatos", res.getBody().accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Login del usuario sin datos

  Guarda el token aparte: pisar `accessToken` dejaria el resto de la corrida sin el escenario.

info:
  name: Resumen con parametro desconocido
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/reports/home?from=2026-01"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.months
      operator: length
      value: "6"
    - expression: res.body.spent
      operator: eq
      value: "1905500"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El resumen no recibe parametros

  Uno desconocido se ignora: la respuesta es la misma que sin el.

info:
  name: Categorias de gasto
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/catalogs/categories?appliesTo=EXPENSE"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const nombres = function () {
          return res.getBody().map(function (c) { return c.name; });
        };

        test("trae las de gasto y las que sirven para los dos", function() {
          expect(nombres()).to.include("Mercado");
          expect(nombres()).to.include("Ajustes");
        });

        test("no trae ninguna de solo ingreso", function() {
          ["Salario", "Freelance", "Ventas", "Intereses", "Reembolsos", "Otros ingresos"].forEach(function (n) {
            expect(nombres()).to.not.include(n);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Filtro appliesTo=EXPENSE

  El mismo filtro que `GET /api/categories`: las de gasto y las `BOTH` (`Ajustes`). Las de solo
  ingreso son las de la semilla.

info:
  name: Monedas con Basic
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/catalogs/currencies"
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Monedas con la credencial compartida

  Un catalogo no es publico: la credencial del Basic abre `/auth/*` y `/status`, y nada mas.

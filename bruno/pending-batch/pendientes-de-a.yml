info:
  name: Los cuatro pendientes de A
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();
        const de = function (desc) {
          return lista.find(function (t) { return t.description === bru.getVar(desc); });
        };

        test("la cena, el taxi, el mercado y el propio", function() {
          expect(lista).to.have.lengthOf(4);
          expect(de("descCena").sharedBy.email).to.equal(bru.getVar("emailLoteB"));
          expect(de("descTaxi").sharedBy.email).to.equal(bru.getVar("emailLoteC"));
          expect(de("descMercado").sharedBy.email).to.equal(bru.getVar("emailLoteC"));
          expect(de("descUsd").sharedBy == null).to.equal(true);
        });

        bru.setVar("idCenaA", de("descCena").id);
        bru.setVar("idTaxiA", de("descTaxi").id);
        bru.setVar("idMercadoA", de("descMercado").id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

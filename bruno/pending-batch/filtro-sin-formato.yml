info:
  name: Filtro sin formato de correo
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending?sharedBy=laura"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: sharedBy

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

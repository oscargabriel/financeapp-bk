info:
  name: Pendientes que compartio B
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending?sharedBy={{emailLoteB}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();

        test("solo la cena de B", function() {
          expect(lista).to.have.lengthOf(1);
          expect(lista[0].id).to.equal(bru.getVar("idCenaA"));
          expect(lista[0].sharedBy.email).to.equal(bru.getVar("emailLoteB"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

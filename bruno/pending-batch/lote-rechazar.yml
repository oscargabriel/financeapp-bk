info:
  name: A rechaza en lote la cena, el taxi y su gasto en dolares
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  body:
    type: json
    data: |-
      { "ids": ["{{idCenaA}}", "{{idTaxiA}}", "{{idPropioUsd}}"] }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

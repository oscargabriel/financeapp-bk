info:
  name: Lote de 101 ids
  type: http
  seq: 32

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  body:
    type: json
    data: |-
      { "ids": {{ids101}} }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: ids
  scripts:
    - type: before-request
      code: |-
        const ids = [];
        for (let i = 0; i < 101; i++) {
          ids.push("0199ffff-0000-7000-8000-" + String(i).padStart(12, "0"));
        }
        bru.setVar("ids101", JSON.stringify(ids));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

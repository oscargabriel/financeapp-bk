info:
  name: A deja pendiente un gasto en dolares
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaLoteA}}",
          "categoryId": "{{idMercadoLoteA}}",
          "amount": 10,
          "currencyCode": "USD",
          "description": "{{descUsd}}"
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body[0].status
      operator: eq
      value: PENDING
  scripts:
    - type: tests
      code: |-
        bru.setVar("idPropioUsd", res.getBody()[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

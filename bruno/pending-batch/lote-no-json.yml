info:
  name: Lote con un cuerpo que no es JSON
  type: http
  seq: 36

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: text
    data: "{ids:"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: JSON_PARSING_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: body

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

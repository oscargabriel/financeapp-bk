info:
  name: El pendiente del almuerzo de B
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenLoteB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const p = res.getBody().find(function (t) { return t.description === bru.getVar("descAlmuerzo"); });
        bru.setVar("idPendienteDeB", p.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

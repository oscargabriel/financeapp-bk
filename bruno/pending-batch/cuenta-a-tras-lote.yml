info:
  name: El saldo de A no cambia con el lote
  type: http
  seq: 45

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const c = res.getBody().find(function (x) { return x.id === bru.getVar("idCuentaLoteA"); });

        test("solo bajaron el almuerzo y el cafe confirmados", function() {
          expect(c.currentBalance).to.equal(500000 - 40000 - 5000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

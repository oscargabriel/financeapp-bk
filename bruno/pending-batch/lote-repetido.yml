info:
  name: Lote con un id repetido
  type: http
  seq: 33

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  body:
    type: json
    data: |-
      { "ids": ["{{idCenaA}}", "{{idCenaMayusculas}}"] }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: ids
  scripts:
    - type: before-request
      code: |-
        bru.setVar("idCenaMayusculas", bru.getVar("idCenaA").toUpperCase());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

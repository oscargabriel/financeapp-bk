info:
  name: Lote con un ajeno y un confirmado
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  body:
    type: json
    data: |-
      { "ids": ["{{idPendienteDeB}}", "{{idConfirmadoA}}"] }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: ids[0]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

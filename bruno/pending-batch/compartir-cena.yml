info:
  name: B comparte la cena con A
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaLoteB}}",
          "categoryId": "{{idMercadoLoteB}}",
          "amount": 60000,
          "description": "{{descCena}}",
          "shares": [
            {
              "affiliationId": "{{idLoteAB}}",
              "amount": 20000
            }
          ]
        }
      ]
  auth:
    type: bearer
    token: "{{tokenLoteB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

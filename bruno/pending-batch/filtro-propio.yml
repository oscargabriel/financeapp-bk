info:
  name: Filtro por el correo de A
  type: http
  seq: 27

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending?sharedBy={{emailLoteA}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

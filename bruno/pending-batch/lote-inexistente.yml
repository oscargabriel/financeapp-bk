info:
  name: Lote con un id que no existe
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/transactions/pending/reject"
  body:
    type: json
    data: |-
      { "ids": ["{{idInexistente}}", "{{idCenaA}}"] }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: ids[0]
  scripts:
    - type: before-request
      code: |-
        bru.setVar("idInexistente", "0199ffff-0000-7000-8000-000000000068");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

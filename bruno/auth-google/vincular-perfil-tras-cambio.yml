info:
  name: Perfil tras el login con el correo anterior
  type: http
  seq: 36

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{accessTrasCambio}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.hasPassword
      operator: eq
      value: "true"
    - expression: res.body.googleLinked
      operator: eq
      value: "true"
  scripts:
    - type: tests
      code: |-
        test("es el mismo usuario, con el correo nuevo", function() {
          expect(res.getBody().email).to.equal(bru.getVar("emailVincularNuevo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

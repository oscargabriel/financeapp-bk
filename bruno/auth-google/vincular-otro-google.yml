info:
  name: Login con otra cuenta Google del mismo correo
  type: http
  seq: 33

http:
  method: POST
  url: "{{baseUrl}}/auth/google/login"
  body:
    type: json
    data: |-
      {
        "idToken": "stub|g-otro-{{tsGoogle}}|{{emailVincular}}|Vera|"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: DUPLICATE_RESOURCE
    - expression: res.body.errors[0].field
      operator: eq
      value: email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El correo ya esta vinculado a otra cuenta Google

  Otro `sub` con el correo de un usuario ya vinculado: no entra ni cambia la vinculacion.

info:
  name: Definir la primera contrasena teniendo una
  type: http
  seq: 46

http:
  method: POST
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "idToken": "{{tokenVincular}}",
        "newPassword": "otraClaveLarga"
      }
  auth:
    type: bearer
    token: "{{accessTrasCambio}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: newPassword

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo para quien no tiene contrasena

  El usuario de `Alta con contrasena para vincular` ya tiene una: la cambia con
  `PUT /users/me/password` y la actual.

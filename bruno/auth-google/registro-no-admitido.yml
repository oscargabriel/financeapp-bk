info:
  name: Registro con Google no admitido
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/auth/google/register"
  body:
    type: json
    data: |-
      {
        "idToken": "stub|g-fuera-{{tsGoogle}}|fuera-{{tsGoogle}}@no-admitido.local|Fuera|"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"
    - expression: res.body.errors[0].code
      operator: eq
      value: REGISTRATION_NOT_ALLOWED
    - expression: res.body.errors[0].field
      operator: eq
      value: email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Categorias del registrado con Google
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{accessGoogle}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("tiene las categorias por defecto", function() {
          expect(res.getBody()).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Categorias por defecto

  El registro con Google copia las mismas categorias que el alta normal.

info:
  name: Login con Google con un token invalido
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/auth/google/login"
  body:
    type: json
    data: |-
      {
        "idToken": "stub|faltan-partes"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_CREDENTIALS
    - expression: res.body.errors[0].field
      operator: eq
      value: idToken

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

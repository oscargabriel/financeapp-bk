info:
  name: Login con la primera contrasena
  type: http
  seq: 51

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailGoogle}}",
        "password": "primeraClaveGoogle"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("guarda el access del login con contrasena", function() {
          bru.setVar("accessConClave", res.getBody().accessToken);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Ahora entra con correo y contrasena

  Antes de la definicion, este mismo login daba 401 (`Login con contrasena de un usuario sin
  contrasena`).

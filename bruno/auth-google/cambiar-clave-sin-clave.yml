info:
  name: Cambiar la contrasena sin tener una
  type: http
  seq: 26

http:
  method: PUT
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "cualquierClave1",
        "newPassword": "otraClaveLarga"
      }
  auth:
    type: bearer
    token: "{{accessGoogle}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: currentPassword

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Sin contrasena no hay actual que probar (FIN-53)

  409 `INVALID_STATE`, distinto de la contrasena equivocada: el usuario define primero la suya con
  `POST /users/me/password`. No cierra la sesion.

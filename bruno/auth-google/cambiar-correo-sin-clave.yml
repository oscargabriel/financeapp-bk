info:
  name: Cambiar el correo sin tener contrasena
  type: http
  seq: 27

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  body:
    type: json
    data: |-
      {
        "email": "otro-{{tsGoogle}}@bruno.local",
        "currentPassword": "cualquierClave1"
      }
  auth:
    type: bearer
    token: "{{accessGoogle}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: currentPassword

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Cambiar el correo exige una contrasena que no tiene (FIN-53)

  409 `INVALID_STATE` en `currentPassword`, aunque la mande: no hay contra que compararla.

info:
  name: Definir la primera contrasena con el Basic
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "idToken": "{{tokenGoogle}}",
        "newPassword": "primeraClaveGoogle"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La credencial compartida no sirve aqui (FIN-53)

  Hereda el Basic de la carpeta a proposito: la ruta vive en la cadena del JWT.

info:
  name: Perfil del registrado sin zona
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{accessSinZona}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.timezone
      operator: eq
      value: America/Bogota

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Sin zona, la del alta normal

  `America/Bogota`, el mismo valor por defecto que `POST /auth/register`.

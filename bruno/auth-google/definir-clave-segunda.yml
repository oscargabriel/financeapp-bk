info:
  name: Definir la primera contrasena por segunda vez
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "idToken": "{{tokenGoogle}}",
        "newPassword": "otraPrimeraClave"
      }
  auth:
    type: bearer
    token: "{{accessConClave}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: newPassword

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo una vez

  Ya tiene contrasena: la cambia con `PUT /users/me/password` y la actual.

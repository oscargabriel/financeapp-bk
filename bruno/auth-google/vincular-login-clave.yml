info:
  name: Login con contrasena tras vincular
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailVincular}}",
        "password": "unaClaveLarga"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Los dos metodos

  Vincular Google no le quita la contrasena.

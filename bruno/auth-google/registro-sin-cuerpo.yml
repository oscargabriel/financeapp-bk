info:
  name: Registro con Google sin idToken
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/auth/google/register"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: idToken

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

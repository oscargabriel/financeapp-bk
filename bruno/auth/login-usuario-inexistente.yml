info:
  name: Login con un correo que no existe
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "nadie@financeapp.local",
        "password": "{{testUserPassword}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
  scripts:
    - type: tests
      code: |-
        test("responde exactamente igual que con la contrasena incorrecta", function() {
          expect(res.getBody().errors[0].code).to.equal("INVALID_CREDENTIALS");
          expect(res.getBody().errors[0].description).to.equal("Correo o contrasena incorrectos");
          expect(res.getBody().errors[0].field).to.equal("credentials");
        });

        test("no dice si el correo esta registrado", function() {
          expect(JSON.stringify(res.getBody())).to.not.contain("nadie@financeapp.local");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Correo desconocido

  Mismo cuerpo, mismo codigo y mismo texto que el intento con la contrasena mala. Si algun dia
  divergieran, el login pasaria a ser un oraculo para averiguar que correos estan registrados.

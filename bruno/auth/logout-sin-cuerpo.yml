info:
  name: Logout sin refreshToken
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: refreshToken

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


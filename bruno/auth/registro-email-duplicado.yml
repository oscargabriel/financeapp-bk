info:
  name: Registro con un correo ya usado
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailDuplicado}}",
        "password": "unaClaveLarga",
        "firstName": "Otra"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: DUPLICATE_RESOURCE
    - expression: res.body.errors[0].field
      operator: eq
      value: email
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailDuplicado", bru.getVar("emailNuevo").toUpperCase());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Correo ya registrado

  Repite, en MAYUSCULAS, el correo que acaba de registrar `Registro de usuario`. Va en mayusculas a
  proposito: el unico de la tabla es sobre `lower(email)`, y sin normalizar el correo antes de
  comparar, este alta pasaria y crearia un segundo usuario con el mismo buzon.

  Hasta FA-103 usaba `prueba@financeapp.local`. Ese correo no esta en la lista de admitidos, asi que
  ahora recibe 403 antes de llegar al 409: es lo que prueba `Registro no admitido con cuenta`. Este
  usa un correo de `@bruno.local`, que si esta admitido.

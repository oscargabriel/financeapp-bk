info:
  name: Login con la contrasena incorrecta
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{testUserEmail}}",
        "password": "estaNoEsLaClave"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_CREDENTIALS
  scripts:
    - type: tests
      code: |-
        test("no emite ningun token", function() {
          expect(res.getBody().accessToken).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Contrasena incorrecta

  El correo existe y esta activo; lo unico que falla es la clave. La respuesta tiene que ser
  identica a la del correo desconocido, y eso es lo que compara el request de al lado.

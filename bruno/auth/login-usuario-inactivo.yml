info:
  name: Login de un usuario desactivado
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "email": "inactivo@financeapp.local",
        "password": "{{testUserPassword}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_CREDENTIALS
  scripts:
    - type: tests
      code: |-
        test("no emite ningun token", function() {
          expect(res.getBody().accessToken).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Usuario desactivado

  `inactivo@financeapp.local` comparte contrasena con el usuario de pruebas y solo se diferencia
  en `is_active = FALSE`. Por eso este request prueba el filtro y nada mas: si devolviera 200,
  seria porque la consulta de credenciales dejo de mirar esa columna.

  El caso de `deleted_at` no tiene request propio. Lo corta la misma condicion de la misma
  consulta, y el escenario no borra usuarios logicamente en ningun otro punto.

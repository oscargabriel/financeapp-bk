info:
  name: financeapp-bk

request:
  auth:
    type: bearer
    token: "{{accessToken}}"

docs:
  content: |
    # financeapp-bk

    Ninguna ruta es publica, y no todas se autentican igual. Desde FA-43 el API tiene dos cadenas:

    - `auth/` y `system/` van con **HTTP Basic**, la credencial compartida de `BASIC_USERNAME` y
      `BASIC_PASSWORD`. Las dos carpetas la declaran en su `folder.yml`.
    - Todo lo demas va con **Bearer**, declarado aqui una sola vez; los requests usan
      `auth: inherit`.

    Los requests que prueban el caso sin credenciales omiten la clave `auth` a proposito, y los dos
    que cruzan las credenciales (`Status con Bearer`, `Gasto mensual con Basic`) declaran la que no
    corresponde: los dos tienen que dar 401.

    El token lo produce `auth/login`, que guarda la variable `accessToken` de la corrida. Por eso
    esa carpeta va primera: sin ella, todo lo demas responderia 401.

    ## Ambientes

    - `local` — `http://localhost:8080`, la app corriendo con el perfil `local`.
    - `prod` — el servicio de Cloud Run, contra Neon. La base es la real: **no correr la coleccion
      entera** (`auth/` registra usuarios y `accounts/` y `transactions/` escriben), y los reportes
      esperan `test-data.sql`, que en Neon no existe. `system/` es de solo lectura.

    Los secretos no se versionan. `local` los lee de `.env` (copiar `.env.sample`, ignorado por
    git) con `{{process.env....}}`.

    `prod` no usa `.env`: `host` (la URL de Cloud Run), `userId`, `basicUser`, `basicPass`,
    `testUserEmail` y `testUserPassword` van con `secret: true` y se escriben en la app, en
    Environments > prod. Bruno los guarda cifrados y no comparten clave con local; `baseUrl` se
    deriva de `host`. El CLI no ve ese almacen, asi que desde la terminal se pasan con `--env-var`,
    pidiendo las credenciales en el momento para que no queden en el historial:

        $c = Get-Credential -Message "Basic de prod"
        bru run system -r --env prod --env-var "host=https://<servicio>.run.app" --env-var "basicUser=$($c.UserName)" --env-var "basicPass=$($c.GetNetworkCredential().Password)"

    ## Convencion

    Una carpeta por recurso del API. Cada etapa del proyecto agrega su carpeta y sus requests con
    bloque `runtime.assertions` en el mismo ciclo TDD que los tests JUnit, y cierra con:

        bru run . -r --env local

    La coleccion no reemplaza a la suite de Gradle: la complementa contra un servidor real.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

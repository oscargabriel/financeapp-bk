info:
  name: Confirmar el grupo de otro usuario
  type: http
  seq: 58

http:
  method: POST
  url: "{{baseUrl}}/transactions/groups/71000000-0000-7000-8000-000000000001/approve"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: groupId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El grupo sembrado de pendientes@ en test-data.sql

  Para otro usuario no existe, este como este.

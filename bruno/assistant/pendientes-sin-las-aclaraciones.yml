info:
  name: Pendientes sin las aclaraciones
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo el gasto y la transferencia

  Ninguna de las tres aclaraciones anteriores creo un pendiente.

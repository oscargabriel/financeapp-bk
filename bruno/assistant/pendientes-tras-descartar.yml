info:
  name: Pendientes tras descartar
  type: http
  seq: 37

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("del grupo descartado no queda ninguno: solo la transferencia", function() {
          expect(res.getBody()[0].type).to.equal("TRANSFER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

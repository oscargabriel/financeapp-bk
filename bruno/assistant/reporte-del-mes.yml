info:
  name: Reporte del mes por la API
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDiaAsistente}}&to={{ultimoDiaAsistente}}&type=expense"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        const reporte = JSON.parse(bru.getVar("reporteAsistente"));
        bru.setVar("primerDiaAsistente", reporte.from);
        bru.setVar("ultimoDiaAsistente", reporte.to);
    - type: tests
      code: |-
        test("es el mismo reporte que devolvio el asistente", function() {
          expect(res.getBody()).to.deep.equal(JSON.parse(bru.getVar("reporteAsistente")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

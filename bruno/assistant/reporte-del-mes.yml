info:
  name: Reporte del mes por la API
  type: http
  seq: 24

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDiaAsistente}}&to={{ultimoDiaAsistente}}&type=expense"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        const reporte = JSON.parse(bru.getVar("reporteAsistente"));
        bru.setVar("primerDiaAsistente", reporte.from);
        bru.setVar("ultimoDiaAsistente", reporte.to);
    - type: tests
      code: |-
        const asistente = JSON.parse(bru.getVar("reporteAsistente"));
        const api = res.getBody();
        function total(tipo) {
          const t = api.totalsByType.find(function (x) { return x.type === tipo; });
          return t ? t.total : 0;
        }

        test("el rango y la moneda son los del reporte", function() {
          expect(asistente.from).to.equal(api.from);
          expect(asistente.to).to.equal(api.to);
          expect(asistente.currencyCode).to.equal(api.currencyCode);
        });

        test("los totales son los del reporte (FA-148: la IA los calcula con sus propias consultas)", function() {
          expect(asistente.income).to.equal(total("INCOME"));
          expect(asistente.expense).to.equal(total("EXPENSE"));
          expect(asistente.net).to.equal(api.net);
        });

        test("la lista es la del reporte sin los programados, en el mismo orden", function() {
          const vigentes = api.transactions.filter(function (t) { return !t.scheduled; });
          expect(asistente.transactions.map(function (t) { return t.id; }))
            .to.deep.equal(vigentes.map(function (t) { return t.id; }));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

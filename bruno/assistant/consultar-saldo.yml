info:
  name: Consultar saldo
  type: http
  seq: 25

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "consultar_saldo"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: GET_BALANCE
  scripts:
    - type: tests
      code: |-
        bru.setVar("saldoAsistente", JSON.stringify(res.getBody().balance));

        test("trae el saldo del mes, y solo el saldo", function() {
          expect(res.getBody().message).to.contain("neto");
          expect(res.getBody().group).to.equal(null);
          expect(res.getBody().report).to.equal(null);
        });

        test("trae solo los campos livianos (FA-148)", function() {
          const b = res.getBody().balance;
          expect(Object.keys(b).sort()).to.deep.equal(["accounts", "allTimeNet", "currencyCode", "expense", "from",
            "income", "net", "to"]);
          expect(Object.keys(b.accounts[0]).sort()).to.deep.equal(["currencyCode", "currentBalance", "name"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

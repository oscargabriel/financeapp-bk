info:
  name: Descartar un grupo mal formado
  type: http
  seq: 62

http:
  method: POST
  url: "{{baseUrl}}/transactions/groups/abc/reject"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: groupId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

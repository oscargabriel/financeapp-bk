info:
  name: Aprobar con la categoria borrada
  type: http
  seq: 51

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idGastoTemporal}}/approve"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: categoryId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Pendientes tras el archivo
  type: http
  seq: 68

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("lo registrado con un archivo tambien entra por el chat web", function() {
          const delGrupo = res.getBody().filter(function (t) { return t.groupId === bru.getVar("grupoArchivo"); });
          expect(delGrupo.length).to.equal(1);
          expect(delGrupo[0].origin).to.equal("WEB_CHAT");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El multipart tambien es el chat web (FIN-112)

  Lo que el asistente registra por `multipart/form-data` entra con `origin` `WEB_CHAT`, igual que por
  JSON.

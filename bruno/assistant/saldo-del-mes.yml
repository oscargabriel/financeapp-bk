info:
  name: Saldo del mes por la API
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/reports/balance"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const asistente = JSON.parse(bru.getVar("saldoAsistente"));
        const api = res.getBody();

        test("el periodo y los totales son los del saldo (FA-148: la IA los calcula con sus propias consultas)", function() {
          expect(asistente.currencyCode).to.equal(api.currencyCode);
          expect(asistente.from).to.equal(api.period.from);
          expect(asistente.to).to.equal(api.period.to);
          expect(asistente.income).to.equal(api.period.income);
          expect(asistente.expense).to.equal(api.period.expense);
          expect(asistente.net).to.equal(api.period.net);
          expect(asistente.allTimeNet).to.equal(api.allTime.net);
        });

        test("las cuentas son las del saldo, con su nombre, moneda y saldo vigente", function() {
          expect(asistente.accounts).to.deep.equal(api.accounts.map(function (c) {
            return { name: c.name, currencyCode: c.currencyCode, currentBalance: c.currentBalance };
          }));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Saldo del mes por la API
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/reports/balance"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("es el mismo saldo que devolvio el asistente", function() {
          expect(res.getBody()).to.deep.equal(JSON.parse(bru.getVar("saldoAsistente")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Gasto pendiente
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\": \"EXPENSE\", \"monto\": 20000, \"cuenta\": \"efectivo\", \"categoria\": \"MERCADO\", \"descripcion\": \"Almuerzo\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: CREATE_TRANSACTION
  scripts:
    - type: tests
      code: |-
        const grupo = res.getBody().group;
        const t = grupo.transactions[0];
        bru.setVar("idPendienteAsistente", t.id);

        test("devuelve el grupo con el unico movimiento, y ya no trae transaction (FIN-58)", function() {
          expect(Object.keys(grupo).sort()).to.deep.equal(["id", "transactions"]);
          expect(grupo.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/);
          expect(grupo.transactions.length).to.equal(1);
          expect(res.getBody()).to.not.have.property("transaction");
        });

        test("queda pendiente", function() {
          expect(t.status).to.equal("PENDING");
        });

        test("resuelve la cuenta y la categoria sin mayusculas y las nombra como las guardo el usuario", function() {
          expect(t.type).to.equal("EXPENSE");
          expect(t.amount).to.equal(20000);
          expect(t.currencyCode).to.equal("COP");
          expect(t.account).to.equal("Efectivo");
          expect(t.destinationAccount).to.equal(null);
          expect(t.category).to.equal("Mercado");
          expect(t.description).to.equal("Almuerzo");
        });

        test("trae solo los campos livianos (FA-148)", function() {
          expect(Object.keys(t).sort()).to.deep.equal(["account", "amount", "category", "currencyCode",
            "description", "destinationAccount", "id", "occurredAt", "status", "type"]);
        });

        test("el mensaje pide confirmar o descartar, y solo viene el grupo", function() {
          expect(res.getBody().message).to.contain("Confirmalo o descartalo");
          expect(res.getBody().report).to.equal(null);
          expect(res.getBody().balance).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # crear_movimiento con nombres en otra caja

  `efectivo` y `MERCADO` se resuelven entre las cuentas y categorias del usuario sin distinguir
  mayusculas ni tildes.

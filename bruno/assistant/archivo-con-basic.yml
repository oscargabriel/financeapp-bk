info:
  name: Archivo con Basic
  type: http
  seq: 79

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - assistant/archivos/recibo.png
        contentType: image/png
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

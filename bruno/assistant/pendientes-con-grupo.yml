info:
  name: Pendientes con el grupo
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();
        const delGrupo = lista.filter(function (t) { return t.groupId === bru.getVar("grupoAsistente"); });

        test("los dos del mensaje salen con el mismo groupId", function() {
          expect(delGrupo.length).to.equal(2);
        });

        test("todo pendiente trae un grupo, y la transferencia tiene el suyo", function() {
          lista.forEach(function (t) { expect(t.groupId).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/); });
          expect(lista.length).to.equal(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

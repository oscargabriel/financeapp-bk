info:
  name: Dos archivos
  type: http
  seq: 75

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - assistant/archivos/recibo.png
        contentType: image/png
      - name: file
        type: file
        value:
          - assistant/archivos/recibo.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: file

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

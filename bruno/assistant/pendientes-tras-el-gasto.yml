info:
  name: Pendientes tras el gasto
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("el gasto del asistente esta en la lista de pendientes", function() {
          expect(res.getBody()[0].id).to.equal(bru.getVar("idPendienteAsistente"));
          expect(res.getBody()[0].origin).to.equal("TELEGRAM");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

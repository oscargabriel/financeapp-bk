info:
  name: Consultar movimientos
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "consultar_movimientos {\"tipo\": \"EXPENSE\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: LIST_TRANSACTIONS
  scripts:
    - type: tests
      code: |-
        bru.setVar("reporteAsistente", JSON.stringify(res.getBody().report));

        test("trae el gasto aprobado del mes, y solo el reporte", function() {
          expect(res.getBody().report.transactions.length).to.equal(1);
          expect(res.getBody().report.transactions[0].id).to.equal(bru.getVar("idPendienteAsistente"));
          expect(res.getBody().group).to.equal(null);
          expect(res.getBody().balance).to.equal(null);
        });

        test("el movimiento nombra su cuenta y su categoria", function() {
          expect(res.getBody().report.transactions[0].account).to.equal("Efectivo");
          expect(res.getBody().report.transactions[0].category).to.equal("Mercado");
        });

        test("trae solo los campos livianos (FA-148)", function() {
          const r = res.getBody().report;
          expect(Object.keys(r).sort()).to.deep.equal(["currencyCode", "expense", "from", "income", "net", "to",
            "transactions"]);
          expect(Object.keys(r.transactions[0]).sort()).to.deep.equal(["account", "amount", "category",
            "currencyCode", "description", "id", "occurredAt", "type"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # consultar_movimientos sin rango

  El mes en curso. Solo el gasto aprobado: la transferencia sigue pendiente y no cuenta.

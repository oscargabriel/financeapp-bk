info:
  name: Usuario del asistente — alta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailAsistente}}",
        "password": "{{claveAsistente}}",
        "firstName": "Asistente",
        "lastName": "Bruno",
        "baseCurrencyCode": "COP",
        "timezone": "America/Bogota"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailAsistente", "asistente-" + Date.now() + "@bruno.local");
        bru.setVar("claveAsistente", "unaClaveLarga");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

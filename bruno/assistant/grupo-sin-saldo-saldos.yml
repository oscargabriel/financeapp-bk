info:
  name: Grupo sin saldo — saldos
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("el saldo no cambia", function() {
          const efectivo = res.getBody().find(function (c) { return c.id === bru.getVar("idEfectivo"); });
          expect(efectivo.currentBalance).to.equal(942000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

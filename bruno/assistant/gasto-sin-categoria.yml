info:
  name: Gasto sin categoria
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\": \"EXPENSE\", \"monto\": 8000, \"cuenta\": \"Efectivo\", \"descripcion\": \"Tinto\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: NEEDS_CLARIFICATION
  scripts:
    - type: tests
      code: |-
        test("pide la categoria con las de gasto y no crea nada", function() {
          expect(res.getBody().message).to.contain("Falta la categoria");
          expect(res.getBody().message).to.contain("Café");
          expect(res.getBody().transaction).to.equal(null);
          expect(res.getBody().report).to.equal(null);
          expect(res.getBody().balance).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El modelo no pudo deducir la categoria (FA-101)

  Con Gemini, el modelo deduce la categoria de lo que describe el usuario y la omite si ninguna
  encaja o caben varias. Este request simula la omision: el back responde con las categorias de
  gasto del usuario.

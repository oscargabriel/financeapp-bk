info:
  name: Archivo de video
  type: http
  seq: 72

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - assistant/archivos/video.mp4
        contentType: video/mp4
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: file

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Video

  Fuera de alcance en FIN-11: 400 sin llamar al modelo.

info:
  name: Cuenta que no existe
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\": \"EXPENSE\", \"monto\": 20000, \"cuenta\": \"Bancolombia\", \"categoria\": \"Mercado\", \"descripcion\": \"Almuerzo\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: NEEDS_CLARIFICATION
  scripts:
    - type: tests
      code: |-
        test("nombra la cuenta pedida y las del usuario, y no crea nada", function() {
          expect(res.getBody().message).to.contain("Bancolombia");
          expect(res.getBody().message).to.contain("Efectivo");
          expect(res.getBody().message).to.contain("Ahorros");
          expect(res.getBody().transaction).to.equal(null);
          expect(res.getBody().report).to.equal(null);
          expect(res.getBody().balance).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

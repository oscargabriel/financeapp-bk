info:
  name: Descartar el grupo de nuevo
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/transactions/groups/{{grupoDescarte}}/reject"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: groupId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

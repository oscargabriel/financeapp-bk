info:
  name: Descartar con Basic
  type: http
  seq: 66

http:
  method: POST
  url: "{{baseUrl}}/transactions/groups/{{grupoAsistente}}/reject"
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

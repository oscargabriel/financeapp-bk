info:
  name: data en blanco
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "   "
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: data

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Asistente (FA-77)

  `POST /api/assistant/messages` con el modelo **stub**: la app tiene que correr con
  `ASISTENTE_PROVEEDOR=stub`, que es lo que hace `verificar-bruno.ps1`. Contra una app con Gemini real
  los mensajes `<funcion> <json>` no se interpretan igual y la carpeta falla.

  El stub traduce `<funcion> <json de argumentos>` a la misma decision que sacaria de Gemini, asi que
  aqui se ejerce todo lo que va despues del modelo: la resolucion de nombres, el alta pendiente con
  `origin` `TELEGRAM` contra la base, las consultas y los rechazos.

  Desde FIN-58, lo que registra entra en un grupo de pendientes que se confirma o se descarta con
  `POST /api/transactions/groups/{groupId}/approve|reject`. El stub entiende una llamada por linea, asi
  que un mensaje puede registrar varios movimientos. Del `seq` 28 en adelante se ejerce ese flujo, despues
  de las consultas, para no cambiarles los totales. `grupo-ajeno` usa el grupo sembrado de `pendientes@`
  en `test-data.sql`.

  Corre con un usuario nuevo por corrida (`asistente-<timestamp>@bruno.local`), sus dos cuentas y dos
  categorias de mas, `Café` y `Cafe`, que normalizan igual y dan el caso ambiguo. No depende de
  `test-data.sql` y se puede correr dos veces.

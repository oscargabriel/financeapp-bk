info:
  name: Gasto con la categoria temporal
  type: http
  seq: 49

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\":\"EXPENSE\",\"monto\":3000,\"cuenta\":\"Efectivo\",\"categoria\":\"Temporal\",\"descripcion\":\"Con categoria temporal\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: CREATE_TRANSACTION
  scripts:
    - type: tests
      code: |-
        const grupo = res.getBody().group;
        bru.setVar("grupoTemporal", grupo.id);
        bru.setVar("idGastoTemporal", grupo.transactions[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

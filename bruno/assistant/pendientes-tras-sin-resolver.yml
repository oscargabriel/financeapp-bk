info:
  name: Pendientes tras el mensaje sin resolver
  type: http
  seq: 55

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # No se creo ninguno de los dos

  Solo sigue la transferencia pendiente.

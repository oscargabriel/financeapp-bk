info:
  name: Grupo sin saldo — siguen pendientes
  type: http
  seq: 45

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("no se confirmo ninguno de los dos", function() {
          const delGrupo = res.getBody().filter(function (t) { return t.groupId === bru.getVar("grupoSinSaldo"); });
          expect(delGrupo.length).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

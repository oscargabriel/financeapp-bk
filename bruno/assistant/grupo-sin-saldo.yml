info:
  name: Grupo sin saldo para los dos
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\":\"EXPENSE\",\"monto\":500000,\"cuenta\":\"Efectivo\",\"categoria\":\"Mercado\",\"descripcion\":\"Sin saldo 1\"}\ncrear_movimiento {\"tipo\":\"EXPENSE\",\"monto\":500000,\"cuenta\":\"Efectivo\",\"categoria\":\"Mercado\",\"descripcion\":\"Sin saldo 2\"}"
      }
  auth:
    type: bearer
    token: "{{tokenAsistente}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: CREATE_TRANSACTION
  scripts:
    - type: tests
      code: |-
        const grupo = res.getBody().group;
        bru.setVar("grupoSinSaldo", grupo.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Cada gasto cabe en el saldo, los dos juntos no


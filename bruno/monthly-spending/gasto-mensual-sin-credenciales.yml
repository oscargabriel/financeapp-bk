info:
  name: Gasto mensual sin credenciales
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}/monthly-spending"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Sin Authorization

  La ausencia de `http.auth` rompe a proposito la herencia del Bearer de la coleccion. Esta ruta no
  es publica; si empieza a responder 200, alguien la abrio sin quererlo.

  Ojo con lo que este 401 NO cubre: desde FA-14 el token si identifica a una persona, pero el
  `userId` sigue viniendo en la URL y nadie compara los dos. Cualquier token valido puede pedir el
  mes de cualquier usuario. Eso lo cierra FA-15, y es ahi donde toca agregar el caso de pedir el
  mes de otro y esperar 403.

info:
  name: Gasto mensual de un usuario sin datos
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/00000000-0000-7000-8000-0000000000ff/monthly-spending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Usuario sin meses

  Un UUID que no existe en `finance.users` responde 200 con un array vacio, no 404. La ausencia de
  filas no es un recurso inexistente, y no consultar la tabla de usuarios evita que el endpoint
  sirva para averiguar que identificadores estan dados de alta.

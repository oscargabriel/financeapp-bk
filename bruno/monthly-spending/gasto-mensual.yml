info:
  name: Gasto mensual (rango por defecto)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}/monthly-spending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: length
      value: "3"
  scripts:
    - type: before-request
      code: |-
        const comoMes = function (desfase) {
          const hoy = new Date();
          const mes = new Date(hoy.getFullYear(), hoy.getMonth() + desfase, 1);
          return mes.getFullYear() + "-" + String(mes.getMonth() + 1).padStart(2, "0");
        };
        bru.setVar("mesActual", comoMes(0));
        bru.setVar("mesAnterior", comoMes(-1));
        bru.setVar("mesDosAtras", comoMes(-2));
    - type: tests
      code: |-
        const porMes = function () {
          const indice = {};
          res.getBody().forEach(function (m) { indice[m.periodMonth] = m; });
          return indice;
        };

        test("la ventana por defecto trae los tres meses con gasto, del mas reciente al mas antiguo", function() {
          const meses = res.getBody().map(function (m) { return m.periodMonth; });
          expect(meses).to.eql([bru.getVar("mesActual"), bru.getVar("mesAnterior"), bru.getVar("mesDosAtras")]);
        });

        test("cada mes trae el contrato completo", function() {
          res.getBody().forEach(function (m) {
            expect(m.periodMonth).to.match(/^[0-9]{4}-[0-9]{2}$/);
            expect(m.currencyCode).to.equal("COP");
            expect(m.totalSpent).to.be.a("number");
            expect(m.transactionCount).to.be.a("number");
          });
        });

        test("el mes en curso cuadra con el escenario: total, meta, restante y porcentaje", function() {
          const mes = porMes()[bru.getVar("mesActual")];
          expect(mes.totalSpent).to.equal(1905500);
          expect(mes.budgetAmount).to.equal(2000000);
          expect(mes.remaining).to.equal(94500);
          expect(mes.percentUsed).to.equal(95.28);
          expect(mes.transactionCount).to.equal(11);
        });

        test("el gasto de las 21:30 del ultimo dia cae en el mes en curso", function() {
          // Los diez gastos del cuerpo del mes suman 1.855.500; la cena de fin de mes anade los
          // 50.000 que en UTC ya pertenecen al mes siguiente. Si la vista truncara el mes sin
          // pasar por la zona del usuario, este mes tendria 10 movimientos y 1.855.500.
          const mes = porMes()[bru.getVar("mesActual")];
          expect(mes.totalSpent).to.equal(1855500 + 50000);
          expect(mes.transactionCount).to.equal(11);
        });

        test("el mes anterior se pasa de la meta: restante negativo y porcentaje sobre 100", function() {
          const mes = porMes()[bru.getVar("mesAnterior")];
          expect(mes.totalSpent).to.equal(1820000);
          expect(mes.budgetAmount).to.equal(1800000);
          expect(mes.remaining).to.equal(-20000);
          expect(mes.percentUsed).to.equal(101.11);
          expect(mes.transactionCount).to.equal(5);
        });

        test("el mes sin meta global trae null, no cero, en meta, restante y porcentaje", function() {
          const mes = porMes()[bru.getVar("mesDosAtras")];
          expect(mes.budgetAmount).to.equal(null);
          expect(mes.remaining).to.equal(null);
          expect(mes.percentUsed).to.equal(null);
        });

        test("la vista suma solo los EXPENSE", function() {
          // Hace dos meses hay tres gastos por 1.445.000 y un salario de 4.500.000: si el INCOME
          // se colara, el total subiria y el conteo seria cuatro.
          const mes = porMes()[bru.getVar("mesDosAtras")];
          expect(mes.totalSpent).to.equal(1445000);
          expect(mes.transactionCount).to.equal(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /api/users/{userId}/monthly-spending

  Resumen de `finance.v_monthly_spending` para el usuario, un elemento por mes:

      [{ "periodMonth": "2026-09", "currencyCode": "COP", "totalSpent": 1905500,
         "budgetAmount": 2000000, "remaining": 94500, "percentUsed": 95.28,
         "transactionCount": 11 }]

  Sin `from` ni `to` devuelve los doce meses que terminan en el mes en curso, del mas reciente al
  mas antiguo. `budgetAmount`, `remaining` y `percentUsed` viajan en `null` cuando ese mes no
  tiene meta global: null es "no configuro meta", que no es lo mismo que cero.

  Requiere haber cargado el escenario de `docs/database/test-data.sql`. Los numeros de los tests
  salen de ahi y son la unica verificacion automatica que tiene el SQL de la vista: el calculo de
  la meta, el corte de mes por zona horaria y que los INCOME no sumen no los cubre la suite de
  Gradle desde que Testcontainers salio.

  Tres de los cuatro meses del escenario entran en la ventana por defecto. El cuarto es el mes
  siguiente, que solo tiene meta y ningun movimiento; queda fuera del rango por defecto y se
  verifica en "Mes con meta y sin movimientos".

info:
  name: Gasto mensual con userId invalido
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/users/no-es-uuid/monthly-spending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_ARGUMENT
    - expression: res.body.errors[0].field
      operator: eq
      value: userId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # userId que no es UUID

  El controlador parsea el UUID a mano en vez de declarar `@PathVariable UUID`: la conversion
  fallida de Spring termina en `ServerWebInputException`, que el handler global reporta como
  `JSON_PARSING_ERROR` sobre el body. Para un parametro de ruta eso apunta al lugar equivocado,
  asi que el error se emite como `INVALID_ARGUMENT` sobre el campo `userId`.

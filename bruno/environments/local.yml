name: local
variables:
  - name: host
    value: http://localhost:8080
    enabled: true
    secret: false
    type: text
  - name: baseUrl
    value: http://localhost:8080/api
    enabled: true
    secret: false
    type: text
  # Desde FA-15 ninguna URL la lleva: el usuario sale del token. Sobrevive como el identificador
  # esperado del usuario del escenario, contra el que se compara el `sub` en
  # monthly-spending/Usuario sin datos - login.
  - name: userId
    value: 10000000-0000-7000-8000-000000000001
    enabled: true
    secret: false
    type: text
  - name: testUserEmail
    value: prueba@financeapp.local
    enabled: true
    secret: false
    type: text
  # secret: false aunque sea una contrasena. Con secret: true Bruno guarda el valor en su propio
  # almacen y descarta este, asi que la interpolacion de process.env no llega a correr y la
  # variable queda vacia: los requests de login fallan con 400 por contrasena ausente.
  - name: testUserPassword
    value: "{{process.env.TEST_USER_PASSWORD}}"
    enabled: true
    secret: false
    type: text
  # Credencial compartida de las rutas que no llevan JWT (auth/ y system/). secret: false por lo
  # mismo que testUserPassword: con secret: true Bruno descarta el valor del archivo y la
  # interpolacion de process.env no llega a correr.
  - name: basicUser
    value: "{{process.env.BASIC_USERNAME}}"
    enabled: true
    secret: false
    type: text
  - name: basicPass
    value: "{{process.env.BASIC_PASSWORD}}"
    enabled: true
    secret: false
    type: text

name: prod
variables:
  - name: host
    value: "{{process.env.PROD_HOST}}"
    enabled: true
    secret: false
    type: text
  - name: baseUrl
    value: "{{process.env.PROD_HOST}}/api"
    enabled: true
    secret: false
    type: text
  - name: userId
    value: "{{process.env.PROD_USER_ID}}"
    enabled: true
    secret: false
    type: text

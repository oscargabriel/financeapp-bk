name: prod
variables:
  - name: host
    value: "{{process.env.PROD_HOST}}"
    enabled: true
    secret: false
    type: text
  - name: baseUrl
    value: "{{process.env.PROD_HOST}}/api"
    enabled: true
    secret: false
    type: text
  # Desde FA-15 ninguna URL la lleva: el usuario sale del token. Sobrevive como el identificador
  # esperado del usuario del escenario, contra el que se compara el `sub` en
  # monthly-spending/Usuario sin datos - login.
  - name: userId
    value: "{{process.env.PROD_USER_ID}}"
    enabled: true
    secret: false
    type: text
  - name: basicUser
    value: "{{process.env.BASIC_USERNAME}}"
    enabled: true
    secret: false
    type: text
  - name: basicPass
    value: "{{process.env.BASIC_PASSWORD}}"
    enabled: true
    secret: false
    type: text

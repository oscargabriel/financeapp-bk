name: prod
variables:
  # Todo prod va con secret: true y sin valor, igual que los secretos del servicio en Cloud Run: se
  # escribe en la app de Bruno (Environments > prod), que lo guarda cifrado en su almacen local, y
  # nada de prod queda en texto plano en disco ni en bruno/.env. No se lee de process.env: con
  # secret: true Bruno descartaria esa interpolacion. Tampoco comparte claves con local, asi que
  # cambiar de ambiente no pisa nada. El CLI no ve ese almacen: bru run --env prod necesita
  # --env-var para cada una.
  #
  # host es la URL de Cloud Run, sin /api y sin barra final. baseUrl se deriva de el para no
  # escribir la URL dos veces.
  - name: host
    value: ""
    enabled: true
    secret: true
    type: text
  - name: baseUrl
    value: "{{host}}/api"
    enabled: true
    secret: false
    type: text
  # Desde FA-15 ninguna URL la lleva: el usuario sale del token. Sobrevive como el identificador
  # esperado del usuario del escenario, contra el que se compara el `sub` en
  # monthly-spending/Usuario sin datos - login.
  - name: userId
    value: ""
    enabled: true
    secret: true
    type: text
  # Credencial compartida del Basic (auth/ y system/): la de los secretos basic-username y
  # basic-password del servicio.
  - name: basicUser
    value: ""
    enabled: true
    secret: true
    type: text
  - name: basicPass
    value: ""
    enabled: true
    secret: true
    type: text
  # Usuario con el que se hace login en prod (auth/login). No existe test-data.sql en Neon: es una
  # cuenta real registrada en el servicio.
  - name: testUserEmail
    value: ""
    enabled: true
    secret: true
    type: text
  - name: testUserPassword
    value: ""
    enabled: true
    secret: true
    type: text

info:
  name: Modificar perfil borrando opcionales
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  body:
    type: json
    data: |-
      {
        "phone": "",
        "lastName": "  "
      }
  auth:
    type: bearer
    token: "{{tokenPerfil}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.phone
      operator: isNull
    - expression: res.body.lastName
      operator: isNull
    - expression: res.body.firstName
      operator: eq
      value: Ana Maria

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El blanco borra los opcionales

  Con null como "no cambia", el texto en blanco es la forma de vaciar el apellido y el celular.

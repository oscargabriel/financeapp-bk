info:
  name: Login con la clave nueva
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailPerfilNuevo}}",
        "password": "{{clavePerfilNueva}}"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La contrasena nueva sirve para entrar

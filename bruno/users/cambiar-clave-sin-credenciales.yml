info:
  name: Cambiar clave sin credenciales
  type: http
  seq: 25

http:
  method: PUT
  url: "{{baseUrl}}/users/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "unaClaveLarga",
        "newPassword": "otraClaveLarga"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Sin Authorization

  Sin la clave `http.auth` a proposito, para romper la herencia del Bearer de la coleccion.

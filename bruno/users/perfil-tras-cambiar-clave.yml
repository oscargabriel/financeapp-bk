info:
  name: Perfil con el token de antes del cambio de clave
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{tokenPerfil}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El cambio de clave cierra las sesiones (FIN-47)

  `tokenPerfil` es el access con el que se cambio la clave. Sigue sin vencer, pero es de antes del
  cambio: tiene que dar 401 en el acto. Es lo unico de la coleccion que ejerce la consulta de la
  sesion contra `users.token_version`.

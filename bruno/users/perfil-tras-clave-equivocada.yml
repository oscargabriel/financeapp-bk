info:
  name: Perfil tras la clave equivocada
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{tokenPerfil}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un cambio rechazado no cierra la sesion (FIN-47)

  Despues de `Cambiar clave con la actual equivocada`, el mismo token sigue sirviendo.

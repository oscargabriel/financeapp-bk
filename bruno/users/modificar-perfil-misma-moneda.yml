info:
  name: Modificar perfil con la misma moneda
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  body:
    type: json
    data: |-
      {
        "baseCurrencyCode": " eur "
      }
  auth:
    type: bearer
    token: "{{tokenPerfil}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.baseCurrencyCode
      operator: eq
      value: EUR
  scripts:
    - type: tests
      code: |-
        test("el nombre de la moneda inactiva no se aplico", function() {
          expect(res.getBody().firstName).to.equal("Ana Maria");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La misma moneda

  La moneda actual en otra caja es 200 sin cambio. No consulta el catalogo ni las tasas: eso lo
  prueba `UpdateUserProfileUseCaseTest`, porque desde aqui no se ve.

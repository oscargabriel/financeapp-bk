info:
  name: Modificar perfil solo con la moneda
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/users/me"
  body:
    type: json
    data: |-
      {
        "baseCurrencyCode": "EUR"
      }
  auth:
    type: bearer
    token: "{{tokenPerfil}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.baseCurrencyCode
      operator: eq
      value: EUR
    - expression: res.body.firstName
      operator: eq
      value: Ana Maria

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Solo la moneda base

  La moneda cuenta como campo modificable (FIN-29): un parche que solo la trae no es vacio. EUR
  necesita la tasa USD->EUR de hoy; si falta, el cambio la pide al proveedor (el stub de
  `verificar-bruno.ps1` responde 0.8) antes de guardar.

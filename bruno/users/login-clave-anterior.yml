info:
  name: Login con la clave anterior
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailPerfilNuevo}}",
        "password": "{{clavePerfil}}"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_CREDENTIALS

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


info:
  name: Crear categoria con campos invalidos
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/categories"
  body:
    type: json
    data: |-
      {
        "appliesTo": "GASTO",
        "color": "rojo"
      }
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "4"
  scripts:
    - type: tests
      code: |-
        test("un error por campo, los cuatro juntos", function() {
          const campos = res.getBody().errors.map(function (e) { return e.field; }).sort();
          expect(campos).to.deep.equal(["appliesTo", "color", "icon", "name"]);
          res.getBody().errors.forEach(function (e) { expect(e.code).to.equal("VALIDATION_ERROR"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Todos los errores de formato en una respuesta

  Sin `name` ni `icon`, con `appliesTo` fuera del enum y un color que no es `#RRGGBB`. El orden de los
  errores no esta garantizado: se comparan por contenido.

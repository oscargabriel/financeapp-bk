info:
  name: Gasto con categoria borrada
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaCategorias}}",
          "categoryId": "{{idPlantas}}",
          "amount": 1000,
          "description": "Semillas"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: "[0].categoryId"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Una categoria borrada no recibe movimientos

  El mismo 400 que una categoria que no existe.

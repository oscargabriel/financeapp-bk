info:
  name: Borrar categoria ajena
  type: http
  seq: 48

http:
  method: DELETE
  url: "{{baseUrl}}/categories/{{idGimnasioEscenario}}"
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La categoria de otro usuario

  404 y no 403: la respuesta no confirma que la categoria exista. "Categoria ajena sigue viva"
  comprueba que no se borro.

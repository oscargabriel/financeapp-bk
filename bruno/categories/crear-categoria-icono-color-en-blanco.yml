info:
  name: Crear categoria con icono y color en blanco
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/categories"
  body:
    type: json
    data: |-
      {
        "name": "Sin adornos",
        "appliesTo": "INCOME",
        "icon": " ",
        "color": ""
      }
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        test("un error en icon y otro en color", function() {
          const campos = res.getBody().errors.map(function (e) { return e.field; }).sort();
          expect(campos).to.deep.equal(["color", "icon"]);
          res.getBody().errors.forEach(function (e) { expect(e.code).to.equal("VALIDATION_ERROR"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # En blanco tampoco vale

  Antes de FA-66 se guardaban como `null`; ahora son el mismo 400 que si faltaran.

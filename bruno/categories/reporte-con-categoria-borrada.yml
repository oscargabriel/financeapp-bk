info:
  name: Reporte con categoria borrada
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{ayerCategorias}}&to={{mananaCategorias}}"
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        const dos = function (n) { return String(n).padStart(2, "0"); };
        const comoDia = function (f) {
          return f.getFullYear() + "-" + dos(f.getMonth() + 1) + "-" + dos(f.getDate());
        };
        const hoy = new Date();
        bru.setVar("ayerCategorias", comoDia(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1)));
        bru.setVar("mananaCategorias", comoDia(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + 1)));
    - type: tests
      code: |-
        const r = res.getBody();

        test("el gasto conserva la categoria borrada, con su nombre", function() {
          const gasto = r.transactions.find(function (t) { return t.id === bru.getVar("idGastoHuerta"); });
          expect(gasto.categoryId).to.equal(bru.getVar("idPlantas"));
          expect(gasto.categoryName).to.equal("HUERTA");
        });

        test("los totales por categoria la siguen contando", function() {
          const total = r.totalsByCategory.find(function (t) { return t.categoryId === bru.getVar("idPlantas"); });
          expect(total.categoryName).to.equal("HUERTA");
          expect(total.total).to.equal(20000);
          expect(total.count).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La historia no cambia al borrar

  De ayer a manana, para no depender de la hora de la corrida frente a la zona del usuario.

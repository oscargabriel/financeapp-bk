info:
  name: Modificar categoria con id mal formado
  type: http
  seq: 30

http:
  method: PATCH
  url: "{{baseUrl}}/categories/abc"
  body:
    type: json
    data: |-
      {
        "name": "Huerta"
      }
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Id que no es UUID

  El controlador lo parsea a mano: la conversion de Spring saldria como `JSON_PARSING_ERROR`.

info:
  name: Modificar categoria con Basic
  type: http
  seq: 41

http:
  method: PATCH
  url: "{{baseUrl}}/categories/{{idPlantas}}"
  body:
    type: json
    data: |-
      {
        "name": "Con Basic"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # PATCH con la credencial compartida

  El Basic abre `/auth/*` y `/status`, no las categorias.

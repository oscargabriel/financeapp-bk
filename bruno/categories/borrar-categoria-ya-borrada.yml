info:
  name: Borrar categoria ya borrada
  type: http
  seq: 45

http:
  method: DELETE
  url: "{{baseUrl}}/categories/{{idPlantas}}"
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Dos veces la misma

  La segunda ya no encuentra una categoria viva: el mismo 404 que una inexistente.

info:
  name: Categoria ajena sigue viva
  type: http
  seq: 49

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "24"
  scripts:
    - type: tests
      code: |-
        test("el Gimnasio del escenario sigue en el listado", function() {
          const ids = res.getBody().map(function (c) { return c.id; });
          expect(ids).to.include(bru.getVar("idGimnasioEscenario"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El 404 no borro nada

  Con el `accessToken` del usuario del escenario, despues de "Borrar categoria ajena".

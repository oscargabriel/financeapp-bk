info:
  name: Listar categorias
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: length
      value: "24"
  scripts:
    - type: tests
      code: |-
        const nombres = function () {
          return res.getBody().map(function (c) { return c.name; });
        };
        const porNombre = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; });
        };

        test("cada categoria trae el contrato completo y nada del usuario", function() {
          res.getBody().forEach(function (c) {
            expect(c.id).to.match(/^[0-9a-f-]{36}$/);
            expect(c.name).to.be.a("string");
            expect(["EXPENSE", "INCOME", "BOTH"]).to.include(c.appliesTo);
            expect(c.isSystem).to.be.a("boolean");
            expect(c).to.have.all.keys("id", "name", "appliesTo", "icon", "color", "isSystem");
          });
        });

        test("no trae la categoria borrada logicamente", function() {
          expect(nombres()).to.not.include("Cigarrillos");
        });

        test("ordena por sort_order: la semilla, luego Ajustes (260) y Gimnasio (300)", function() {
          const lista = nombres();
          expect(lista[0]).to.equal("Mercado");
          expect(lista[22]).to.equal("Ajustes");
          expect(lista[23]).to.equal("Gimnasio");
        });

        test("las de la semilla son de sistema y las propias no", function() {
          expect(porNombre("Mercado").isSystem).to.equal(true);
          expect(porNombre("Gimnasio").isSystem).to.equal(false);
          expect(porNombre("Ajustes").isSystem).to.equal(false);
        });

        test("icono y color viajan tal cual, y en null cuando la categoria no los tiene", function() {
          expect(porNombre("Mercado").icon).to.equal("shopping-cart");
          expect(porNombre("Mercado").color).to.equal("#2E7D32");
          expect(porNombre("Ajustes").icon).to.equal(null);
          expect(porNombre("Ajustes").color).to.equal(null);
        });

        bru.setVar("idsCategoriasEscenario", JSON.stringify(res.getBody().map(function (c) { return c.id; })));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /api/categories

  Categorias vivas del usuario del token, ordenadas por `sort_order` y luego por nombre:

      [{ "id": "...", "name": "Mercado", "appliesTo": "EXPENSE", "icon": "shopping-cart",
         "color": "#2E7D32", "isSystem": true }]

  El escenario de `docs/database/test-data.sql` deja 24: las 22 de la semilla, `Gimnasio` y
  `Ajustes` (BOTH, sin icono ni color). `Cigarrillos` existe pero esta borrada logicamente, y es
  la que prueba que `deleted_at` filtra.

  Guarda los ids en `idsCategoriasEscenario` para que "Categorias de un usuario nuevo" compruebe
  que otro usuario no ve ninguno.

info:
  name: Categorias tras modificar
  type: http
  seq: 25

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "25"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();

        test("la modificada sigue en su posicion, con los datos del PATCH", function() {
          expect(lista[22]).to.deep.equal({
            id: bru.getVar("idPlantas"), name: "Huerta", appliesTo: "EXPENSE",
            icon: "leaf", color: "#33691E", isSystem: false
          });
        });

        test("la de la semilla sigue primera, con el color nuevo", function() {
          expect(lista[0].id).to.equal(bru.getVar("idMercadoUsuarioNuevo"));
          expect(lista[0].color).to.equal("#1B5E20");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El listado refleja el PATCH

  El PATCH no toca `sort_order`: cada categoria queda donde estaba. Son 25: las 22 de la semilla,
  `Plantas`, `Bonos` y el `Gimnasio` de "Crear categoria con nombre de otro usuario".

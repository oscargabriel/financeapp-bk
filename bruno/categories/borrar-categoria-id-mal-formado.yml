info:
  name: Borrar categoria con id mal formado
  type: http
  seq: 47

http:
  method: DELETE
  url: "{{baseUrl}}/categories/abc"
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El id no es un UUID

  400 sobre `id`, no `JSON_PARSING_ERROR`: el controlador lo parsea a mano.

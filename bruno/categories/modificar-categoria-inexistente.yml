info:
  name: Modificar categoria inexistente
  type: http
  seq: 29

http:
  method: PATCH
  url: "{{baseUrl}}/categories/0199a1c0-0000-7000-8000-000000000000"
  body:
    type: json
    data: |-
      {
        "name": "Nadie"
      }
  auth:
    type: bearer
    token: "{{tokenCategorias}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un UUID que no es de ninguna categoria

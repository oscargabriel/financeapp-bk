info:
  name: Listar categorias de ambos
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/categories?appliesTo=BOTH"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        const nombres = function () {
          return res.getBody().map(function (c) { return c.name; });
        };

        test("trae solo las que sirven para los dos", function() {
          expect(nombres()).to.eql(["Ajustes"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /api/categories?appliesTo=BOTH

  `BOTH` no es "todas": son las que sirven para gasto y para ingreso a la vez. Una de solo
  gasto no cumple, asi que en el escenario solo queda `Ajustes`.

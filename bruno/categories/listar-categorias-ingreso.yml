info:
  name: Listar categorias de ingreso
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/categories?appliesTo=INCOME"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "7"
  scripts:
    - type: tests
      code: |-
        const nombres = function () {
          return res.getBody().map(function (c) { return c.name; });
        };

        test("trae las de ingreso y la que sirve para los dos, ninguna de gasto", function() {
          const alcances = res.getBody().map(function (c) { return c.appliesTo; });
          expect(alcances).to.not.include("EXPENSE");
          expect(nombres()).to.include("Salario");
          expect(nombres()).to.include("Ajustes");
          expect(nombres()).to.not.include("Mercado");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # GET /api/categories?appliesTo=INCOME

  Las 6 de ingreso de la semilla mas `Ajustes`, que es BOTH. Es el caso que motiva el filtro:
  el cliente no debe ofrecer `Mercado` al registrar un ingreso.

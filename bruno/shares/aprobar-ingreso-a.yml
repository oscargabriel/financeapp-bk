info:
  name: A aprueba el ingreso
  type: http
  seq: 50

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idIngresoA}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaA}}",
        "categoryId": "{{idSalarioA}}"
      }
  auth:
    type: bearer
    token: "{{tokenCompA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: CONFIRMED
    - expression: res.body.type
      operator: eq
      value: INCOME

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

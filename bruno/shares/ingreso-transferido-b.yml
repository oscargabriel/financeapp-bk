info:
  name: B recibe el ingreso de la transferencia
  type: http
  seq: 77

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenCompB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const p = res.getBody().find(function (t) { return t.description === bru.getVar("descTransferencia"); });

        test("un ingreso pendiente por su monto, sin parte de origen", function() {
          expect(p.type).to.equal("INCOME");
          expect(p.amount).to.equal(60000);
          expect(p.accountId).to.equal(null);
          expect(p.sharedBy.email).to.equal(bru.getVar("emailCompA"));
          expect(p.sharedFrom).to.equal(null);
        });

        bru.setVar("idIngresoTransfB", p.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

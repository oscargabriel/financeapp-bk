info:
  name: A recibe el pago de C
  type: http
  seq: 88

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("ingreso de 5000 con sharedBy C", function() {
          const i = res.getBody().find(function (t) {
            return t.type === "INCOME" && t.amount === 5000 && t.sharedBy.email === bru.getVar("emailCompC");
          });
          expect(i).to.not.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Categorias de A
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{tokenCompA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const id = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).id;
        };
        bru.setVar("idMercadoA", id("Mercado"));
        bru.setVar("idSalarioA", id("Salario"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

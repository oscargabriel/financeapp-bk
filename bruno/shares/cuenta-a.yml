info:
  name: Cuenta Ahorros A de A
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/accounts"
  body:
    type: json
    data: |-
      {
        "name": "Ahorros A",
        "type": "SAVINGS",
        "currencyCode": "COP",
        "initialBalance": 500000
      }
  auth:
    type: bearer
    token: "{{tokenCompA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idCuentaA", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

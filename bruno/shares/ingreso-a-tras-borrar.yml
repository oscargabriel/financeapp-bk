info:
  name: El ingreso de A por la parte pagada sigue
  type: http
  seq: 68

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("A sigue teniendo el ingreso de 10000 de B", function() {
          const i = res.getBody().find(function (t) {
            return t.type === "INCOME" && t.amount === 10000 && t.sharedBy.email === bru.getVar("emailCompB");
          });
          expect(i).to.not.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

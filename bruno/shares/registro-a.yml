info:
  name: Usuario A — alta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailCompA}}",
        "password": "unaClaveLarga",
        "firstName": "Ana",
        "lastName": "Paga"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        const ts = Date.now();
        ["A", "B", "C", "Nadie"].forEach(function (l) {
          bru.setVar("emailComp" + l, "compartidos-" + l.toLowerCase() + "-" + ts + "@bruno.local");
        });
        bru.setVar("descCena", "Cena compartida " + ts);
        bru.setVar("descBorrar", "Almuerzo para borrar " + ts);
        bru.setVar("descUsd", "Hotel en dolares " + ts);
        bru.setVar("descUsdRechazo", "Taxi en dolares " + ts);
        bru.setVar("descTransferencia", "Regalo a B y C " + ts);
        bru.setVar("descDesvincular", "Mercado con C " + ts);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

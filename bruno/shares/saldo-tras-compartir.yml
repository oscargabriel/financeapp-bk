info:
  name: A paga el total
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const c = res.getBody().find(function (x) { return x.id === bru.getVar("idCuentaA"); });

        test("la cuenta de A baja el total compartido y el cafe", function() {
          expect(c.currentBalance).to.equal(500000 - 15000 - 90000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: B solo tiene su parte
  type: http
  seq: 38

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenCompB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
    - expression: res.body[0].id
      operator: eq
      value: "{{idParteB}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

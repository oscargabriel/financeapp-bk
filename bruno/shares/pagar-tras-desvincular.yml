info:
  name: C paga su parte despues de desvincularse
  type: http
  seq: 87

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idParteDesvC}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaC}}",
        "categoryId": "{{idMercadoC}}"
      }
  auth:
    type: bearer
    token: "{{tokenCompC}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: CONFIRMED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

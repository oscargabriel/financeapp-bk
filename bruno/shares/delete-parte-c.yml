info:
  name: C intenta borrar su parte
  type: http
  seq: 53

http:
  method: DELETE
  url: "{{baseUrl}}/transactions/{{idParteC}}"
  auth:
    type: bearer
    token: "{{tokenCompC}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: status

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

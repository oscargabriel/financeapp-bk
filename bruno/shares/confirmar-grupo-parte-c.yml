info:
  name: C intenta confirmar el grupo de su parte
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseUrl}}/transactions/groups/{{grupoParteC}}/approve"
  auth:
    type: bearer
    token: "{{tokenCompC}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: "[0].accountId"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

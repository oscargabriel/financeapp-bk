info:
  name: Afiliacion que no existe
  type: http
  seq: 33

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaA}}",
          "categoryId": "{{idMercadoA}}",
          "amount": 50000,
          "description": "Inexistente",
          "shares": [
            {
              "affiliationId": "00000000-0000-7000-8000-00000000dead",
              "amount": 10000
            }
          ]
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: "[0].shares[0].affiliationId"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

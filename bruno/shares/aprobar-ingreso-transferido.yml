info:
  name: B aprueba el ingreso transferido
  type: http
  seq: 78

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idIngresoTransfB}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaB}}",
        "categoryId": "{{idSalarioB}}"
      }
  auth:
    type: bearer
    token: "{{tokenCompB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: CONFIRMED
    - expression: res.body.type
      operator: eq
      value: INCOME
    - expression: res.body.amount
      operator: eq
      value: "60000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

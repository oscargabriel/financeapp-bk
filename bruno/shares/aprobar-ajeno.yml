info:
  name: A intenta aprobar la parte de B
  type: http
  seq: 45

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idParteB}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaA}}",
        "categoryId": "{{idMercadoA}}"
      }
  auth:
    type: bearer
    token: "{{tokenCompA}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Aprobar con cuerpo sin credencial
  type: http
  seq: 46

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idParteB}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaB}}",
        "categoryId": "{{idMercadoB}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

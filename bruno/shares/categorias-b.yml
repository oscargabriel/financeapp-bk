info:
  name: Categorias de B
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{tokenCompB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const id = function (nombre) {
          return res.getBody().find(function (c) { return c.name === nombre; }).id;
        };
        bru.setVar("idMercadoB", id("Mercado"));
        bru.setVar("idSalarioB", id("Salario"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

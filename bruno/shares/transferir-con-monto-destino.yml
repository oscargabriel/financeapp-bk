info:
  name: Transferencia compartida con monto de destino
  type: http
  seq: 82

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "TRANSFER",
          "accountId": "{{idCuentaA}}",
          "categoryId": "{{idMercadoA}}",
          "amount": 100000,
          "description": "{{descTransferencia}}",
          "shares": [
            {
              "affiliationId": "{{idAfAB}}",
              "amount": 60000
            },
            {
              "affiliationId": "{{idAfAC}}",
              "amount": 40000
            }
          ],
          "destinationAmount": 100000
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: "[0].destinationAmount"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: B aprueba con una categoria de ingreso
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idParteB}}/approve"
  body:
    type: json
    data: |-
      {
        "accountId": "{{idCuentaB}}",
        "categoryId": "{{idSalarioB}}"
      }
  auth:
    type: bearer
    token: "{{tokenCompB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: categoryId

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

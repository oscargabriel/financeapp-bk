info:
  name: Transferencia programada
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "TRANSFER",
          "accountId": "{{idPrincipalProgramados}}",
          "destinationAccountId": "{{idDestinoProgramados}}",
          "amount": 50000,
          "description": "Al bolsillo",
          "occurredAt": "{{diaTransferencia}}T12:00:00-05:00"
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body[0].scheduled
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Cuentas tras pasarlo a ayer
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("el gasto ya cuenta: 500000 - 10000 - 40000", function() {
          const principal = res.getBody().find(function (c) { return c.id === bru.getVar("idPrincipalProgramados"); });
          expect(principal.currentBalance).to.equal(450000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

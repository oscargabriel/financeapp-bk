info:
  name: Cuenta destino
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/accounts"
  body:
    type: json
    data: |-
      {
        "name": "Bolsillo",
        "type": "CASH",
        "currencyCode": "COP"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idDestinoProgramados", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

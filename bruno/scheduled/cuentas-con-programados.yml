info:
  name: Cuentas con programados
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const cuenta = function (variable) {
          return res.getBody().find(function (c) { return c.id === bru.getVar(variable); });
        };

        test("la principal solo descuenta el gasto de hoy", function() {
          expect(cuenta("idPrincipalProgramados").currentBalance).to.equal(490000);
        });

        test("la transferencia programada no mueve ninguna de las dos cuentas", function() {
          expect(cuenta("idDestinoProgramados").currentBalance).to.equal(0);
        });

        test("la tarjeta conserva su saldo y su cupo disponible", function() {
          expect(cuenta("idTarjetaProgramados").currentBalance).to.equal(-200000);
          expect(cuenta("idTarjetaProgramados").availableCredit).to.equal(2800000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

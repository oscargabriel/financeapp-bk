info:
  name: Cuentas al vencer
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        await bru.sleep(6000);
    - type: tests
      code: |-
        test("cuenta solo, sin que nadie lo tocara", function() {
          const principal = res.getBody().find(function (c) { return c.id === bru.getVar("idPrincipalProgramados"); });
          expect(principal.currentBalance).to.equal(450000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Llega la fecha

  Espera a que pase el `occurredAt` de `Vence en segundos` y relee: nadie modifico el movimiento.

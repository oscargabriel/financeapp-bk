info:
  name: Cuenta principal
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/accounts"
  body:
    type: json
    data: |-
      {
        "name": "Principal",
        "type": "CASH",
        "currencyCode": "COP",
        "initialBalance": 500000
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idPrincipalProgramados", res.getBody().id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Programado otra vez a futuro
  type: http
  seq: 17

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{idGastoProgramado}}"
  body:
    type: json
    data: |-
      {
        "occurredAt": "{{diaProgramado}}T12:00:00-05:00"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.scheduled
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Categorias del usuario
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idMercadoProgramados", res.getBody().find(function (c) { return c.name === "Mercado"; }).id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

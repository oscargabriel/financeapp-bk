info:
  name: Gasto programado en la tarjeta
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idTarjetaProgramados}}",
          "categoryId": "{{idMercadoProgramados}}",
          "amount": 100000,
          "description": "Compra programada",
          "occurredAt": "{{diaTarjeta}}T12:00:00-05:00"
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body[0].scheduled
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

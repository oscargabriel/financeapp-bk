info:
  name: Saldo al vencer
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/reports/balance"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.allTime.expense
      operator: eq
      value: "50000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |

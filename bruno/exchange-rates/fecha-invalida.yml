info:
  name: Fecha mal formada
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=USD&to=COP&date=10-10-2026"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: date

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  La fecha va como AAAA-MM-DD.

info:
  name: Tasas con Basic
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=USD&to=COP&date=2026-10-10"
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  La credencial compartida abre `/auth/*` y `/status`, y nada mas.

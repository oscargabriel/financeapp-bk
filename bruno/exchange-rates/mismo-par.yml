info:
  name: Mismo par
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=COP&to=COP&date=2026-01-15"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.rate
      operator: eq
      value: "1"
    - expression: res.body.rateDate
      operator: eq
      value: 2026-01-15

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  El mismo par vale 1 en cualquier fecha, sin buscar tasas ni consultar al proveedor.

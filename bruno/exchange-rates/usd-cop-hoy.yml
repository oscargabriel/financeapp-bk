info:
  name: USD a COP hoy
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=USD&to=COP&date={{tasaHoy}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.rate
      operator: eq
      value: "4100"
  scripts:
    - type: before-request
      code: |-
        const dos = function (n) { return String(n).padStart(2, "0"); };
        const comoDia = function (f) {
          return f.getFullYear() + "-" + dos(f.getMonth() + 1) + "-" + dos(f.getDate());
        };
        const hoy = new Date();
        const dia = function (desfase) {
          return comoDia(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + desfase));
        };
        bru.setVar("tasaHoy", dia(0));
    - type: tests
      code: |-
        test("responde el par, la fecha pedida y la de la fila usada", function() {
          const r = res.getBody();
          expect(r).to.have.all.keys("from", "to", "date", "rate", "rateDate");
          expect(r.from).to.equal("USD");
          expect(r.to).to.equal("COP");
          expect(r.date).to.equal(bru.getVar("tasaHoy"));
          expect(r.rateDate).to.equal(bru.getVar("tasaHoy"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  La fila MANUAL de hoy de `test-data.sql`: no hace falta el proveedor.

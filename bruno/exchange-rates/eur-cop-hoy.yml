info:
  name: EUR a COP hoy
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=EUR&to=COP&date={{tasaHoy}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.rate
      operator: eq
      value: "5125"
  scripts:
    - type: before-request
      code: |-
        const dos = function (n) { return String(n).padStart(2, "0"); };
        const comoDia = function (f) {
          return f.getFullYear() + "-" + dos(f.getMonth() + 1) + "-" + dos(f.getDate());
        };
        const hoy = new Date();
        const dia = function (desfase) {
          return comoDia(new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + desfase));
        };
        bru.setVar("tasaHoy", dia(0));
        bru.setVar("tasaHace10", dia(-10));
        bru.setVar("tasaHace30", dia(-30));
    - type: tests
      code: |-
        test("la fecha de la tasa es hoy", function() {
          expect(res.getBody().rateDate).to.equal(bru.getVar("tasaHoy"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Falta USD->EUR de hoy: la app consulta al stub y guarda sus tasas. COP no se pisa (sigue la
  MANUAL en 4100), asi que la tasa es 4100 / 0.8 = 5125, en esta corrida y en las siguientes.

info:
  name: Sin tasa para la fecha
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/exchange-rates?from=USD&to=COP&date=2000-01-01"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: date

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  No hay ninguna fila USD->COP con fecha <= 2000-01-01.

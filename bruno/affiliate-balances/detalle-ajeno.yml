info:
  name: Detalle con la afiliacion de B y C
  type: http
  seq: 52

http:
  method: GET
  url: "{{baseUrl}}/affiliations/{{idSaldoBC}}/shares"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

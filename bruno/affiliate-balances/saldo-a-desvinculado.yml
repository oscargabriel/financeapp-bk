info:
  name: Saldo de A con C desvinculada
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/affiliations/balances"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();
        const de = function (letra) {
          return lista.find(function (e) { return e.person.email === bru.getVar("emailSaldo" + letra); });
        };
        const saldo = function (codigo, aFavor, enContra, neto) {
          return { currencyCode: codigo, owedToMe: aFavor, iOwe: enContra, net: neto };
        };

        test("C sigue saliendo, desvinculada, con su deuda", function() {
          expect(de("C").status).to.equal("UNLINKED");
          expect(de("C").affiliationId).to.equal(bru.getVar("idSaldoAC"));
          expect(de("C").person.firstName).to.equal("Caro");
          expect(de("C").balances).to.eql([saldo("COP", 15000, 0, 15000)]);
        });

        test("B sigue afiliado", function() {
          expect(de("B").status).to.equal("ACCEPTED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

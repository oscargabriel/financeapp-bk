info:
  name: C rechaza su parte de la cena
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseUrl}}/transactions/{{idCenaC}}/reject"
  auth:
    type: bearer
    token: "{{tokenSaldoC}}"

runtime:

info:
  name: Saldo de A con C afiliada de nuevo
  type: http
  seq: 45

http:
  method: GET
  url: "{{baseUrl}}/affiliations/balances"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();
        const de = function (letra) {
          return lista.find(function (e) { return e.person.email === bru.getVar("emailSaldo" + letra); });
        };
        const saldo = function (codigo, aFavor, enContra, neto) {
          return { currencyCode: codigo, owedToMe: aFavor, iOwe: enContra, net: neto };
        };

        test("C sale una sola vez, con la afiliacion nueva", function() {
          const deC = lista.filter(function (e) { return e.person.email === bru.getVar("emailSaldoC"); });
          expect(deC).to.have.lengthOf(1);
          expect(deC[0].status).to.equal("ACCEPTED");
          expect(deC[0].affiliationId).to.equal(bru.getVar("idSaldoAC2"));
          expect(deC[0].balances).to.eql([saldo("COP", 15000, 0, 15000)]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: El pendiente de la cena de B
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenSaldoB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const p = res.getBody().find(function (t) { return t.description === bru.getVar("descCena"); });
        bru.setVar("idCenaB", p.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

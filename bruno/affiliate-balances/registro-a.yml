info:
  name: Usuario A — alta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailSaldoA}}",
        "password": "unaClaveLarga",
        "firstName": "Ana",
        "lastName": "Saldo"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        const ts = Date.now();
        ["A", "B", "C", "Nadie"].forEach(function (l) {
          bru.setVar("emailSaldo" + l, "saldos-" + l.toLowerCase() + "-" + ts + "@bruno.local");
        });
        bru.setVar("descCena", "Cena " + ts);
        bru.setVar("descHotel", "Hotel " + ts);
        bru.setVar("descTaxi", "Taxi " + ts);
        bru.setVar("descRegalo", "Regalo " + ts);
        bru.setVar("descAlmuerzo", "Almuerzo " + ts);
        bru.setVar("descMercado", "Mercado " + ts);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

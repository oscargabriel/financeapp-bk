info:
  name: A comparte el hotel en dolares con B
  type: http
  seq: 22

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaSaldoA}}",
          "categoryId": "{{idMercadoSaldoA}}",
          "amount": 50,
          "currencyCode": "USD",
          "description": "{{descHotel}}",
          "shares": [
            {
              "affiliationId": "{{idSaldoAB}}",
              "amount": 20
            }
          ]
        }
      ]
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

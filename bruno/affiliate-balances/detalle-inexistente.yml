info:
  name: Detalle con una afiliacion inexistente
  type: http
  seq: 53

http:
  method: GET
  url: "{{baseUrl}}/affiliations/0199ffff-ffff-7fff-8fff-ffffffffffff/shares"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors
      operator: length
      value: "1"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

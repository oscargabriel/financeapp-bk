info:
  name: Saldo de A tras el rechazo de C
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseUrl}}/affiliations/balances"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();
        const de = function (letra) {
          return lista.find(function (e) { return e.person.email === bru.getVar("emailSaldo" + letra); });
        };
        const saldo = function (codigo, aFavor, enContra, neto) {
          return { currencyCode: codigo, owedToMe: aFavor, iOwe: enContra, net: neto };
        };

        test("C queda a paz y salvo y sigue saliendo", function() {
          expect(de("C").status).to.equal("ACCEPTED");
          expect(de("C").balances).to.eql([]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

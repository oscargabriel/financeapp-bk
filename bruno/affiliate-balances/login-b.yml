info:
  name: Usuario B — login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailSaldoB}}",
        "password": "unaClaveLarga"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("tokenSaldoB", res.getBody().accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

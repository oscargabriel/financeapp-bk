info:
  name: Detalle de A con C desvinculada
  type: http
  seq: 42

http:
  method: GET
  url: "{{baseUrl}}/affiliations/{{idSaldoAC}}/shares"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const partes = res.getBody();
        const parte = function (desc) {
          return partes.find(function (s) { return s.description === bru.getVar(desc); });
        };

        test("la cena rechazada y el mercado pendiente", function() {
          expect(partes).to.have.lengthOf(2);
          expect(parte("descCena").status).to.equal("REJECTED");
          expect(parte("descMercado").status).to.equal("PENDING");
          expect(parte("descMercado").direction).to.equal("OWED_TO_ME");
        });

        test("de la mas reciente a la mas antigua", function() {
          const fechas = partes.map(function (s) { return s.occurredAt; });
          expect(fechas).to.eql(fechas.slice().sort().reverse());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

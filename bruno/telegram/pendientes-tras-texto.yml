info:
  name: Pendientes tras el texto
  type: http
  seq: 26

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenTelegram}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        const gasto = res.getBody()[0];
        bru.setVar("grupoTelegram", gasto.groupId);

        test("el gasto del chat queda pendiente con origen TELEGRAM", function() {
          expect(gasto.origin).to.equal("TELEGRAM");
          expect(gasto.type).to.equal("EXPENSE");
          expect(gasto.amount).to.equal(45000);
          expect(gasto.description).to.equal("Almuerzo");
          expect(gasto.groupId).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Lo que registró el chat (FIN-61)

  Guarda el grupo en `grupoTelegram` para los botones de Confirmar.

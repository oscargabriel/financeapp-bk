info:
  name: Pendientes sin repetir
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenTelegram}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("sigue siendo el mismo grupo", function() {
          expect(res.getBody()[0].groupId).to.equal(bru.getVar("grupoTelegram"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El update repetido no registró otro gasto (FIN-61)

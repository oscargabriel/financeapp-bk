info:
  name: Status con el secreto del webhook
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/status"
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{telegramSecret}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
  scripts:
    - type: tests
      code: |-
        test("lo rechaza la cadena del Basic", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Basic");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El secreto del webhook no abre la cadena del Basic

  Una mitad del cruce: el secreto solo sirve en `POST /api/telegram/webhook`.

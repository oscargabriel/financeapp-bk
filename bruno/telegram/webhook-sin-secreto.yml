info:
  name: Webhook sin el secreto
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/telegram/webhook"
  body:
    type: json
    data: |-
      {"update_id": 10001, "message": {"message_id": 1, "date": 1791590401, "chat": {"id": 123456, "type": "private"}, "text": "hola"}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del webhook", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Telegram");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un update sin X-Telegram-Bot-Api-Secret-Token

  Lo rechaza la cadena del webhook antes de leer el cuerpo. El reto `Telegram` distingue este 401
  del de la cadena del JWT: si el request recibe `Bearer`, la ruta dejo de caer en su cadena.

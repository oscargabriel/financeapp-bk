info:
  name: Cuentas con el secreto del webhook
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{telegramSecret}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
  scripts:
    - type: tests
      code: |-
        test("lo rechaza la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El secreto del webhook no abre la cadena del JWT

  La otra mitad del cruce: sin Bearer, una ruta de la API responde 401 aunque traiga el secreto.

info:
  name: Webhook con un mensaje sin texto
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/telegram/webhook"
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{telegramSecret}}"
  body:
    type: json
    data: |-
      {
        "update_id": 10002,
        "message": {
          "message_id": 2,
          "date": 1791590401,
          "from": {"id": 123456, "is_bot": false, "first_name": "Prueba"},
          "chat": {"id": 123456, "type": "private"},
          "photo": [{"file_id": "foto-de-prueba", "file_unique_id": "foto", "width": 90, "height": 90}]
        }
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un mensaje sin texto de un chat sin vincular

  Una foto o un audio llegan sin `text`. Desde un chat sin vincular reciben el mismo texto fijo que
  un mensaje de texto, con el botón para compartir el contacto (FIN-60). Un contacto no es un
  mensaje sin texto cualquiera: es la vinculación, y la prueban los `webhook-contacto-*`.

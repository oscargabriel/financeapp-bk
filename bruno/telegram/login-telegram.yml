info:
  name: Login del usuario que vincula el chat
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "telegram@financeapp.local",
        "password": "{{testUserPassword}}"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("tokenTelegram", res.getBody().accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Login de telegram@financeapp.local (FIN-60)

  Ana, con `phone` `+573009990001` admitido y sin chat. El token va a `tokenTelegram` para no dejar
  al resto de la corrida autenticado como ella.

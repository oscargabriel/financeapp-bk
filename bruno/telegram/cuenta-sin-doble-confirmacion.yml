info:
  name: Cuenta sin doble confirmación
  type: http
  seq: 33

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenTelegram}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const billetera = res.getBody().find(function (c) { return c.name === "Billetera"; });

        test("la Billetera no bajó otra vez", function() {
          expect(billetera.currentBalance).to.equal(455000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El segundo Confirmar no movió el saldo (FIN-61)

info:
  name: Webhook con un secreto equivocado
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/telegram/webhook"
  headers:
    - name: X-Telegram-Bot-Api-Secret-Token
      value: "{{telegramSecret}}-mal"
  body:
    type: json
    data: |-
      {"update_id": 10001, "message": {"message_id": 1, "date": 1791590401, "chat": {"id": 123456, "type": "private"}, "text": "hola"}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
    - expression: res.body.errors[0].field
      operator: eq
      value: authorization
  scripts:
    - type: tests
      code: |-
        test("el rechazo no cuenta por que fallo", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Telegram");
          expect(res.getBody().errors[0].description).to.equal("Autenticacion requerida");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un update con la cabecera y otro valor

  El mismo 401 que sin la cabecera: la respuesta no dice si falto o si no coincidio.

info:
  name: B lista la recibida
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/affiliations"
  auth:
    type: bearer
    token: "{{tokenAfiliadoB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        const a = res.getBody()[0];

        test("recibida, con los datos de quien la envio", function() {
          expect(a.id).to.equal(bru.getVar("idAfiliacion"));
          expect(a.direction).to.equal("RECEIVED");
          expect(a.status).to.equal("REQUESTED");
          expect(a.person.email).to.equal(bru.getVar("emailAfiliadoA"));
          expect(a.person.firstName).to.equal("Ana");
          expect(a.person.lastName).to.equal("Afiliada");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

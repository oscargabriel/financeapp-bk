info:
  name: Listar las enviadas
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/affiliations"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        const lista = res.getBody();

        test("de la mas reciente a la mas antigua", function() {
          expect(lista.map(function (a) { return a.id; })).to.eql([bru.getVar("idSinCuenta"), bru.getVar("idAfiliacion")]);
        });

        test("ninguna enviada abierta trae el nombre, tenga o no cuenta", function() {
          lista.forEach(function (a) {
            expect(a.direction).to.equal("SENT");
            expect(a.status).to.equal("REQUESTED");
            expect(a.person.firstName).to.equal(null);
            expect(a.person.lastName).to.equal(null);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

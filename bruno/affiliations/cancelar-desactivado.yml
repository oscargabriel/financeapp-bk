info:
  name: Cancelar la del desactivado
  type: http
  seq: 42

http:
  method: POST
  url: "{{baseUrl}}/affiliations/{{idDesactivado}}/cancel"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
  scripts:
    - type: tests
      code: |-
        test("no devuelve cuerpo", function() {
          expect(res.getBody() || "").to.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

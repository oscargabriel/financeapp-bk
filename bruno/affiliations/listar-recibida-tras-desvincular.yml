info:
  name: A lista la de B
  type: http
  seq: 38

http:
  method: GET
  url: "{{baseUrl}}/affiliations"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        const a = res.getBody().find(function (x) { return x.id === bru.getVar("idDeB"); });

        test("recibida de B, con su nombre", function() {
          expect(a.direction).to.equal("RECEIVED");
          expect(a.status).to.equal("REQUESTED");
          expect(a.person.firstName).to.equal("Beto");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

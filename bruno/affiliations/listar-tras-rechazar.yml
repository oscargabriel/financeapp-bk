info:
  name: Listar tras el rechazo
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseUrl}}/affiliations"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("solo quedan las abiertas", function() {
          expect(res.getBody().map(function (a) { return a.id; })).to.eql([bru.getVar("idSinCuenta")]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

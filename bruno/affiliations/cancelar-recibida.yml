info:
  name: B cancela la que recibio
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/affiliations/{{idAfiliacion}}/cancel"
  auth:
    type: bearer
    token: "{{tokenAfiliadoB}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: INVALID_STATE
    - expression: res.body.errors[0].field
      operator: eq
      value: status

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

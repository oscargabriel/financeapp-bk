info:
  name: Enviar a un usuario desactivado
  type: http
  seq: 41

http:
  method: POST
  url: "{{baseUrl}}/affiliations"
  body:
    type: json
    data: |-
      {
        "email": "inactivo@financeapp.local"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailInactivo", "inactivo@financeapp.local");
    - type: tests
      code: |-
        const r = res.getBody();

        test("devuelve el contrato de la relacion", function() {
          expect(r).to.have.all.keys("id", "status", "direction", "person", "createdAt", "updatedAt");
          expect(r.person).to.have.all.keys("email", "firstName", "lastName");
        });

        test("enviada, abierta y sin el nombre de la otra persona", function() {
          expect(r.status).to.equal("REQUESTED");
          expect(r.direction).to.equal("SENT");
          expect(r.person.email).to.equal(bru.getVar("emailInactivo"));
          expect(r.person.firstName).to.equal(null);
          expect(r.person.lastName).to.equal(null);
        });

        bru.setVar("idDesactivado", r.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  inactivo@financeapp.local lo siembra test-data.sql desactivado: cuenta como correo sin cuenta.

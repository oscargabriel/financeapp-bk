info:
  name: C acepta una ajena
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/affiliations/{{idAfiliacion}}/accept"
  auth:
    type: bearer
    token: "{{tokenAfiliadoC}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

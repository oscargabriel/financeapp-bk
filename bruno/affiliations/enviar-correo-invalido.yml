info:
  name: Enviar a un correo invalido
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/affiliations"
  body:
    type: json
    data: |-
      {
        "email": "no-es-correo"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: email

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

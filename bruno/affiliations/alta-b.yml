info:
  name: Usuario B — alta
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailAfiliadoB}}",
        "password": "unaClaveLarga",
        "firstName": "Beto",
        "lastName": "Afiliado"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

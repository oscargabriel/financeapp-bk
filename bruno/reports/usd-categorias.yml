info:
  name: Persona en USD — categorias
  type: http
  seq: 51

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{tokenUsd}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        bru.setVar("idMercadoUsd", res.getBody().find(function (c) { return c.name === "Mercado"; }).id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

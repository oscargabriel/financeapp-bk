info:
  name: Otro usuario — alta
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailReportes}}",
        "password": "{{claveReportes}}",
        "firstName": "Otro",
        "lastName": "Usuario",
        "baseCurrencyCode": "COP",
        "timezone": "America/Bogota"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailReportes", "reportes-" + Date.now() + "@bruno.local");
        bru.setVar("claveReportes", "unaClaveLarga");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Segundo usuario de la carpeta

  Un usuario nuevo por corrida, con un gasto en el mes en curso: el reporte de cada uno no puede
  traer el del otro. La limpieza vive en `docs/database/test-data.sql`.

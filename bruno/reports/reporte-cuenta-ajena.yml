info:
  name: Reporte con cuenta ajena
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&accountId={{idCuentaReportes}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "0"
    - expression: res.body.totalsByCategory
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La cuenta del segundo usuario, pedida por el del escenario

  `idCuentaReportes` es la cuenta que crea `otro-usuario-cuenta`, y ya tiene un gasto en el mes. Con
  el token del usuario del escenario no aparece nada, y la respuesta no dice si la cuenta existe.

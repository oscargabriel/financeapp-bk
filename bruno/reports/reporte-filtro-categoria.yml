info:
  name: Reporte filtrado por categoria
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&categoryId={{idMercadoEscenario}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        const r = res.getBody();

        test("solo trae movimientos de Mercado, sin transferencias", function() {
          r.transactions.forEach(function (t) {
            expect(t.categoryName).to.equal("Mercado");
            expect(t.type).to.equal("EXPENSE");
          });
        });

        test("los totales reflejan el filtro", function() {
          expect(r.totalsByType).to.eql([
            { type: "EXPENSE", total: 127500, count: 2 },
            { type: "INCOME", total: 0, count: 0 },
            { type: "TRANSFER", total: 0, count: 0 }
          ]);
          expect(r.totalsByCategory).to.have.length(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

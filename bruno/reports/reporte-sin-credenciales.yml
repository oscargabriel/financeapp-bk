info:
  name: Reporte sin credenciales
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.errors[0].code
      operator: eq
      value: UNAUTHENTICATED
  scripts:
    - type: tests
      code: |-
        test("el reto es el de la cadena del JWT", function() {
          expect(res.getHeader("www-authenticate")).to.equal("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

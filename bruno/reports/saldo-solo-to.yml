info:
  name: Saldo con solo to
  type: http
  seq: 43

http:
  method: GET
  url: "{{baseUrl}}/reports/balance?to={{ultimoDia}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: from

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Van los dos o ninguno: el error va sobre el que falta.

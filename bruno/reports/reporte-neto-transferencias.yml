info:
  name: Neto del reporte con solo transferencias
  type: http
  seq: 35

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&type=TRANSFER"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "2"
    - expression: res.body.net
      operator: eq
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Las transferencias no son ni ingreso ni egreso: con solo ellas el neto es cero.

info:
  name: Reporte de una cuenta que solo origina una transferencia
  type: http
  seq: 28

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&accountId={{idAhorrosUsdEscenario}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "1"
    - expression: res.body.transactions[0].description
      operator: eq
      value: Cambio de dólares
  scripts:
    - type: tests
      code: |-
        test("la transferencia sale de Ahorros USD", function() {
          expect(res.getBody().transactions[0].accountId).to.equal(bru.getVar("idAhorrosUsdEscenario"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Ahorros USD

  Su unico movimiento del mes es el cambio de 100 USD hacia Bancolombia.

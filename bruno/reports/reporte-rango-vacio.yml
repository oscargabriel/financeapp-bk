info:
  name: Reporte de un rango vacio
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from=2000-01-01&to=2000-01-31"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "0"
  scripts:
    - type: tests
      code: |-
        const r = res.getBody();

        test("totales en cero y la moneda igual", function() {
          expect(r.currencyCode).to.equal("COP");
          expect(r.totalsByType).to.eql([
            { type: "EXPENSE", total: 0, count: 0 },
            { type: "INCOME", total: 0, count: 0 },
            { type: "TRANSFER", total: 0, count: 0 }
          ]);
          expect(r.totalsByCategory).to.eql([]);
          expect(r.net).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

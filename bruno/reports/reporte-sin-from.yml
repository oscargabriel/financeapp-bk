info:
  name: Reporte sin from
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?to={{ultimoDia}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: from

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  `from` y `to` son obligatorios: sin rango no hay reporte.

info:
  name: Saldo negativo
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseUrl}}/reports/balance?from={{segundoDiaAnterior}}&to={{ultimoDiaAnterior}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("sin ingresos en el rango el neto sale negativo", function() {
          const p = res.getBody().period;
          expect([p.income, p.expense, p.net]).to.eql([0, 620000, -620000]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  El salario y el arriendo del mes anterior caen el dia 1: desde el dia 2 solo quedan gastos
  (320.000 + 95.000 + 40.000 + 165.000).

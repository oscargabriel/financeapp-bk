info:
  name: Reporte con categoria ajena
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&categoryId=40000000-0000-7000-8000-000000000099"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "0"
    - expression: res.body.totalsByCategory
      operator: length
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un id bien formado que no es del usuario

  No es 400 ni 404: el filtro no encuentra nada, sin revelar si la categoria existe para otro.

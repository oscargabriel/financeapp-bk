info:
  name: Reporte con categoria y tipo
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{primerDia}}&to={{ultimoDia}}&categoryId={{idMercadoEscenario}},{{idSalarioEscenario}}&type=EXPENSE"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.transactions
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        test("el tipo deja fuera el Salario: solo quedan los gastos de Mercado", function() {
          res.getBody().transactions.forEach(function (t) {
            expect(t.categoryName).to.equal("Mercado");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Categorias separadas por coma, mas tipo

  Los dos filtros se combinan con Y: Salario es de ingreso y `type=EXPENSE` lo excluye.

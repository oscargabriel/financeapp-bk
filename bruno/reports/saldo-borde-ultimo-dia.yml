info:
  name: Saldo del ultimo dia del mes
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/reports/balance?from={{ultimoDiaFrontera}}&to={{ultimoDiaFrontera}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.period.expense
      operator: eq
      value: "35000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  "Buses de fin de mes" (35.000) ocurre el ultimo dia de hace dos meses a las 21:30 en Bogota, ya el dia siguiente en UTC: el dia se corta en
  la zona del usuario, como en el reporte.

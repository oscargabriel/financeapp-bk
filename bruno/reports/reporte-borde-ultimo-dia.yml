info:
  name: Reporte del ultimo dia del mes
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/reports/transactions?from={{ultimoDiaFrontera}}&to={{ultimoDiaFrontera}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("incluye los buses de las 21:30, que en UTC ya es del dia siguiente", function() {
          const descripciones = res.getBody().transactions.map(function (t) { return t.description; });
          expect(descripciones).to.include("Buses de fin de mes");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Borde de dia por zona horaria

  "Buses de fin de mes" ocurre el ultimo dia de hace dos meses a las 21:30 en Bogota, las 02:30 UTC del dia
  siguiente. El dia se corta en la zona del usuario (`users.timezone`), asi que es de este dia.

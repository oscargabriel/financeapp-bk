info:
  name: Modificar cuenta desactivada
  type: http
  seq: 36

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/20000000-0000-7000-8000-000000000005"
  body:
    type: json
    data: |-
      {
        "name": "Nequi"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: Nequi
    - expression: res.body.isActive
      operator: eq
      value: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Una cuenta desactivada se modifica igual

  Nequi, la desactivada del escenario, con su mismo nombre: el PATCH responde 200 y el escenario
  queda como estaba.

info:
  name: Borrar cuenta
  type: http
  seq: 60

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/{{idCajaChica}}"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
  scripts:
    - type: tests
      code: |-
        test("no trae cuerpo", function() {
          expect(res.getBody() === undefined || res.getBody() === null || res.getBody() === "").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # DELETE /api/accounts/{id}

  Borrado logico: marca `deleted_at` y la fila se queda, con su movimiento. Responde 204 sin cuerpo.

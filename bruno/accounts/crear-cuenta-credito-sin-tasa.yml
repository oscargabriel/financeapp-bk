info:
  name: Crear tarjeta sin tasa
  type: http
  seq: 79

http:
  method: POST
  url: "{{baseUrl}}/accounts"
  body:
    type: json
    data: |-
      {
        "name": "Amex",
        "type": "CREDIT",
        "currencyCode": "COP",
        "creditLimit": 2000000
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.monthlyInterestRate
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La tasa es opcional

  Como el cupo: una tarjeta sin tasa cargada la trae en `null`. Va al final de la carpeta para no
  cambiar los listados que cuentan las cuentas del usuario.

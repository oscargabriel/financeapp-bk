info:
  name: Desactivar con estado en null
  type: http
  seq: 52

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaEfectivo}}"
  body:
    type: json
    data: |-
      {
        "isActive": null
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: body

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El estado en null no es un cambio

  Como cualquier otro campo en null: el parche queda vacio.

info:
  name: Categorias del usuario de cuentas
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/categories?appliesTo=EXPENSE"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        const mercado = res.getBody().find(function (c) { return c.name === "Mercado"; });

        test("el registro le copio la semilla", function() {
          expect(mercado).to.not.equal(undefined);
        });

        bru.setVar("idMercadoCuentas", mercado.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Una categoria de gasto para el movimiento

  Guarda el id de `Mercado` en `idMercadoCuentas` para "Gasto en Bolsillo".

info:
  name: Borrar Sobre sin programados
  type: http
  seq: 103

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/{{idSobre}}"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Sin programados y en cero, se borra

info:
  name: Modificar tasa con ceros a la derecha
  type: http
  seq: 85

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaCredito}}"
  body:
    type: json
    data: |-
      {
        "monthlyInterestRate": 1.50000
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.monthlyInterestRate
      operator: eq
      value: 1.5

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Los ceros a la derecha no son decimales

  `1.50000` tiene cinco decimales escritos pero vale 1.5, igual que en los montos.

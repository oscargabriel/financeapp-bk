info:
  name: Cuentas tras reactivar
  type: http
  seq: 48

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Bolsillo vuelve activa y con el gasto descontado", function() {
          const bolsillo = res.getBody().find(function (c) { return c.id === bru.getVar("idCuentaEfectivo"); });
          expect(bolsillo.isActive).to.equal(true);
          expect(bolsillo.currentBalance).to.equal(230000);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # De vuelta en el listado por defecto

  Con el gasto de 20000 descontado.

info:
  name: Reactivar cuenta
  type: http
  seq: 46

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaEfectivo}}"
  body:
    type: json
    data: |-
      {
        "isActive": true
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isActive
      operator: eq
      value: true
    - expression: res.body.currentBalance
      operator: eq
      value: 250000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Reactivar

  Vuelve activa con el mismo saldo: el 400 del gasto no escribio nada.

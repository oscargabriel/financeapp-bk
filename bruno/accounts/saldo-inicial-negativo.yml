info:
  name: Saldo — corregir el inicial a negativo
  type: http
  seq: 91

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idSencillo}}"
  body:
    type: json
    data: |-
      { "initialBalance": -1 }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |-
        test("un solo VALIDATION_ERROR en initialBalance", function() {
          const errores = res.getBody().errors;
          expect(errores).to.have.length(1);
          expect(errores[0].code).to.equal("VALIDATION_ERROR");
          expect(errores[0].field).to.equal("initialBalance");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

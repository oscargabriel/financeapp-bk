info:
  name: Pendiente hacia Caja chica
  type: http
  seq: 59

http:
  method: POST
  url: "{{baseUrl}}/assistant/messages"
  body:
    type: json
    data: |-
      {
        "data": "crear_movimiento {\"tipo\": \"TRANSFER\", \"monto\": 10000, \"cuenta\": \"bolsillo\", \"cuenta_destino\": \"caja chica\", \"descripcion\": \"Sencillo\"}"
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.intent
      operator: eq
      value: CREATE_TRANSACTION
  scripts:
    - type: tests
      code: |-
        const t = res.getBody().transaction;
        bru.setVar("idPendienteHaciaCajaChica", t.id);

        test("queda pendiente", function() {
          expect(t.status).to.equal("PENDING");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Una transferencia pendiente que llega a la cuenta

  `Caja chica` es el destino: el borrado tambien se la lleva. `Bolsillo`, el origen, no cambia de
  saldo porque el pendiente nunca se aplico.

info:
  name: Cuenta ajena intacta
  type: http
  seq: 38

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("el Efectivo del escenario no cambio de nombre", function() {
          const efectivo = res.getBody().find(function (c) { return c.id === "20000000-0000-7000-8000-000000000001"; });
          expect(efectivo.name).to.equal("Efectivo");
          expect(res.getBody().map(function (c) { return c.name; })).to.not.include("Robada");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El 404 no escribio nada

  Con el `accessToken` del usuario del escenario, despues de "Modificar cuenta ajena".

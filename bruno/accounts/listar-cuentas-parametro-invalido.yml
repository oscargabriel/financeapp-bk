info:
  name: Listar cuentas con parametro invalido
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/accounts?includeInactive=si"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].code
      operator: eq
      value: VALIDATION_ERROR
    - expression: res.body.errors[0].field
      operator: eq
      value: includeInactive

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # includeInactive fuera de true y false

  El controlador parsea el parametro a mano: si lo convirtiera Spring, el fallo saldria como
  `JSON_PARSING_ERROR` sobre el body, que no dice que el problema es la query.

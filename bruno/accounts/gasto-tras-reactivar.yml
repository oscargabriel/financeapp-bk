info:
  name: Gasto tras reactivar
  type: http
  seq: 47

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  body:
    type: json
    data: |-
      [
        {
          "type": "EXPENSE",
          "accountId": "{{idCuentaEfectivo}}",
          "categoryId": "{{idMercadoCuentas}}",
          "amount": 20000,
          "description": "Mercado"
        }
      ]
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Reactivada, admite movimientos otra vez

  El mismo cuerpo que "Gasto en cuenta desactivada".

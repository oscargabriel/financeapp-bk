info:
  name: Pendientes tras borrado rechazado
  type: http
  seq: 62

http:
  method: GET
  url: "{{baseUrl}}/transactions/pending"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("siguen los tres pendientes", function() {
          const ids = res.getBody().map(function (t) { return t.id; });
          expect(ids).to.include(bru.getVar("idPendienteCajaChica"));
          expect(ids).to.include(bru.getVar("idPendienteHaciaCajaChica"));
          expect(ids).to.include(bru.getVar("idPendienteBolsillo"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El 409 no elimino nada

  "Borrar cuenta con saldo" respondio 409: los tres pendientes siguen.

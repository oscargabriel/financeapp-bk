info:
  name: Cuenta sigue activa
  type: http
  seq: 51

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Bolsillo sigue activa y en COP", function() {
          const bolsillo = res.getBody().find(function (c) { return c.id === bru.getVar("idCuentaEfectivo"); });
          expect(bolsillo.isActive).to.equal(true);
          expect(bolsillo.currencyCode).to.equal("COP");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El 409 no escribio nada

  `Bolsillo` sigue en el listado por defecto, en COP.

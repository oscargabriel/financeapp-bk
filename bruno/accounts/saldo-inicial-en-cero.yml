info:
  name: Saldo — inicial que deja la cuenta en cero
  type: http
  seq: 94

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idSencillo}}"
  body:
    type: json
    data: |-
      { "initialBalance": 150000 }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.currentBalance
      operator: eq
      value: 0

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

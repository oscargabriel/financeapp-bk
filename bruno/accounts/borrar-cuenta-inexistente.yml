info:
  name: Borrar cuenta inexistente
  type: http
  seq: 72

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/0199a1c0-0000-7000-8000-000000000000"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un UUID que no es de ninguna cuenta

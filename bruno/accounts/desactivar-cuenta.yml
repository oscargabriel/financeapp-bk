info:
  name: Desactivar cuenta
  type: http
  seq: 41

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaEfectivo}}"
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isActive
      operator: eq
      value: false
    - expression: res.body.currentBalance
      operator: eq
      value: 250000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Desactivar con saldo (FA-68)

  `Bolsillo` tiene saldo vigente 250000 y movimientos: se desactiva igual, y el saldo no cambia.

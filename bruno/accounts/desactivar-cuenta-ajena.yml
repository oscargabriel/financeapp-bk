info:
  name: Desactivar cuenta ajena
  type: http
  seq: 53

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/20000000-0000-7000-8000-000000000001"
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.errors[0].code
      operator: eq
      value: NOT_FOUND
    - expression: res.body.errors[0].field
      operator: eq
      value: id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El Efectivo del escenario, desactivado por otro usuario

  Responde lo mismo que una inexistente.

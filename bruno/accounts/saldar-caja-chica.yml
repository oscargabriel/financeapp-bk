info:
  name: Saldar Caja chica
  type: http
  seq: 63

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCajaChica}}"
  body:
    type: json
    data: |-
      {
        "initialBalance": 30000
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.currentBalance
      operator: eq
      value: 0

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Dejarla en cero corrigiendo el saldo inicial

  El camino de FA-24: el inicial pasa a 30000 y el gasto de 30000 deja el vigente en 0.

info:
  name: Cuentas tras borrar
  type: http
  seq: 46

http:
  method: GET
  url: "{{baseUrl}}/accounts?includeInactive=true"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"
  scripts:
    - type: tests
      code: |-
        test("la borrada no sale ni pidiendo las inactivas", function() {
          const ids = res.getBody().map(function (c) { return c.id; });
          expect(ids).to.not.include(bru.getVar("idCajaChica"));
          expect(ids).to.include(bru.getVar("idCuentaEfectivo"));
          expect(ids).to.include(bru.getVar("idCuentaCredito"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # El listado ya no la trae

  Borrar no es desactivar: `includeInactive=true` tampoco la devuelve.

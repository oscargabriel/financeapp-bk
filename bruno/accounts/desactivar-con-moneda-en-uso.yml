info:
  name: Desactivar con moneda en uso
  type: http
  seq: 50

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaEfectivo}}"
  body:
    type: json
    data: |-
      {
        "currencyCode": "USD",
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.body.errors[0].code
      operator: eq
      value: RESOURCE_IN_USE
    - expression: res.body.errors[0].field
      operator: eq
      value: currencyCode

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Un error del parche no desactiva

  `Bolsillo` tiene movimientos en COP: el 409 de la moneda deja todo el parche sin aplicar, estado
  incluido. "Cuenta sigue activa" lo comprueba.

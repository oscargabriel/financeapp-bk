info:
  name: Usuario nuevo — alta
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{emailCuentas}}",
        "password": "{{claveCuentas}}",
        "firstName": "Otra",
        "lastName": "Persona",
        "baseCurrencyCode": "COP",
        "timezone": "America/Bogota"
      }
  auth:
    type: basic
    username: "{{basicUser}}"
    password: "{{basicPass}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: before-request
      code: |-
        // Un correo por corrida: el alta no es idempotente. La limpieza vive en
        // docs/database/test-data.sql.
        bru.setVar("emailCuentas", "cuentas-" + Date.now() + "@bruno.local");
        bru.setVar("claveCuentas", "unaClaveLarga");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Alta de un segundo usuario

  Primero de los tres requests que prueban que nadie ve las cuentas de otro. El registro no le crea
  ninguna cuenta, asi que cualquier cosa que le devuelva el listado es ajena.

  Va con Basic porque `/auth/register` vive en la cadena de la credencial compartida.

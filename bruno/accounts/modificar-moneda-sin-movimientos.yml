info:
  name: Modificar moneda sin movimientos
  type: http
  seq: 19

http:
  method: PATCH
  url: "{{baseUrl}}/accounts/{{idCuentaCredito}}"
  body:
    type: json
    data: |-
      {
        "currencyCode": "usd"
      }
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.currencyCode
      operator: eq
      value: USD

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # La moneda cambia si la cuenta no tiene historial

  `Mastercard` no tiene movimientos. La moneda se normaliza a mayusculas, como en el alta.

info:
  name: Cuentas sin la desactivada
  type: http
  seq: 43

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth:
    type: bearer
    token: "{{tokenCuentas}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("Bolsillo no aparece y la tarjeta si", function() {
          const ids = res.getBody().map(function (c) { return c.id; });
          expect(ids).to.not.include(bru.getVar("idCuentaEfectivo"));
          expect(ids).to.include(bru.getVar("idCuentaCredito"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Fuera del listado por defecto

  Sin `includeInactive`, solo queda la tarjeta.

# Este archivo es la configuracion de Cloud Run: la imagen solo lleva application.yaml, y el
# servicio completa el resto con variables de entorno y Secret Manager. application-local.yaml y
# application-prod.yaml no se versionan: el primero es el desarrollo diario y el segundo simula la
# nube en local para reproducir una falla puntual. Los dos sobrescriben lo que difiere de aqui.
server:
  # Cloud Run inyecta el puerto en PORT; SERVER_PORT queda para correr la imagen fuera de Run.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  compression:
    enabled: true
  netty:
    connection-timeout: 5s
    idle-timeout: 60s
  # No filtrar internals al cliente (OWASP A05): el detalle tecnico va al log.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: financeapp-bk
  profiles:
    # Sin la variable de entorno se arranca en local. Un despliegue DEBE definir
    # SPRING_PROFILES_ACTIVE=prod, para no depender de que la imagen no traiga application-local.
    # No dejar esta clave sin un valor activo: Boot 4 rechaza 'profiles' vacia y el contexto ni
    # siquiera llega a crearse.
    active: ${SPRING_PROFILES_ACTIVE:local}
  webflux:
    base-path: ${SERVER_BASE_PATH:/api}
  codec:
    max-in-memory-size: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  r2dbc:
    # En Cloud Run, DB_HOST es el host DIRECTO de Neon (sin -pooler), validado en FA-44. Neon
    # rechaza conexiones sin TLS, de ahi sslMode=require por defecto; el driver negocia SNI solo.
    # El search_path (esquema finance, no public) no va en la URL sino en R2dbcSearchPathConfig:
    # Neon ignora el ?schema=, y ese bean pisa el mapa de opciones del driver de todos modos.
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financeapp}?sslMode=${DB_SSL_MODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      # Maximo 3 instancias de Cloud Run x 10 = 30 conexiones, frente a las 901 de max_connections
      # del plan Free de Neon (computo de 2 CU). Con R2DBC, 10 conexiones sirven a las 80
      # peticiones concurrentes por instancia. Si sube el maximo de instancias, rehacer la cuenta.
      # initial-size 1: el arranque en frio (Cloud Run escala a 0) no abre conexiones de mas.
      initial-size: 1
      max-size: 10
      # Por debajo de los 5 min tras los que Neon suspende la base: el pool suelta la conexion
      # antes de que Neon la corte, y validation-query descarta la que quede rota.
      max-idle-time: 4m
      max-create-connection-time: 3s
      validation-query: SELECT 1
  security:
    jwt:
      # Sin default, como el resto de secretos: un despliegue que olvide JWT_SECRET no arranca,
      # en vez de firmar todos los tokens con una clave que estaria en el repositorio.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: ${JWT_ISSUER:financeapp-bk}
    # Credencial compartida de las rutas que no llevan JWT: POST /auth/register, POST /auth/login
    # y GET /status. Sin default por lo mismo que JWT_SECRET: un despliegue que las olvide no
    # arranca, en vez de quedar abierto con un usuario y una clave escritos en el repositorio.
    basic:
      username: ${BASIC_USERNAME}
      password: ${BASIC_PASSWORD}

app:
  # Zona con la que se resuelve "el mes actual" en el rango por defecto de los reportes mensuales.
  timezone: ${APP_TIMEZONE:America/Bogota}

# Obligatorio, sin default: el servicio tiene que declarar la lista de origenes. Mientras no
# exista frontend, Cloud Run lleva "*", decision provisional del usuario (26-09-2026) que se
# reemplaza por la URL del frontend en cuanto exista (OWASP A05).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

status:
  check-timeout: ${STATUS_CHECK_TIMEOUT:2s}

# Verificacion de conectividad con la base al arrancar: si no responde tras agotar los intentos,
# el contexto no termina de levantar y la aplicacion no queda escuchando. Se apaga solo donde no
# hay base que responder (la suite de tests).
startup:
  db-check:
    enabled: ${STARTUP_DB_CHECK_ENABLED:true}
    max-attempts: ${STARTUP_DB_CHECK_MAX_ATTEMPTS:5}
    initial-backoff: ${STARTUP_DB_CHECK_INITIAL_BACKOFF:1s}
    timeout: ${STARTUP_DB_CHECK_TIMEOUT:3s}

logging:
  level:
    root: INFO
    org.springframework: INFO
    io.r2dbc.postgresql: INFO
    com.oscargabriel.financeapp: INFO
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

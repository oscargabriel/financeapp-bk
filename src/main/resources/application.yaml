server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  netty:
    connection-timeout: 5s
    idle-timeout: 60s
  # No filtrar internals al cliente (OWASP A05): el detalle tecnico va al log.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: financeapp-bk
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  webflux:
    base-path: ${SERVER_BASE_PATH:/api}
  codec:
    max-in-memory-size: 1MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financeapp}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      max-create-connection-time: 3s
      validation-query: SELECT 1
  security:
    basic:
      username: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

status:
  check-timeout: ${STATUS_CHECK_TIMEOUT:2s}

logging:
  level:
    root: INFO
    org.springframework: INFO
    io.r2dbc.postgresql: INFO
    com.oscargabriel.financeapp: INFO
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

# Reemplaza al application.yaml de main en el classpath de test: debe ser autocontenido.
# Toda propiedad que un bean exija con @Value hay que replicarla aqui o el contexto revienta
# con PlaceholderResolutionException.
# initial-size 0 evita que el pool abra conexiones al arrancar el contexto, para que la suite
# no dependa de un PostgreSQL levantado.
spring:
  application:
    name: financeapp-bk
  webflux:
    base-path: /api
  r2dbc:
    # Puerto sin escucha a proposito: la suite nunca depende de un PostgreSQL y StatusIT
    # verifica de forma determinista el camino "postgres DOWN".
    url: r2dbc:postgresql://localhost:65535/financeapp-test
    username: test
    password: test
    pool:
      enabled: true
      initial-size: 0
      max-size: 5
  security:
    jwt:
      # Valor fijo y visible: no protege nada porque esta suite no emite tokens que salgan de
      # ella. Tiene 32 bytes porque HS256 no firma con menos y el bean falla al construirse.
      secret: secreto-de-pruebas-de-32-bytes!!
      expiration: 1h
      refresh-expiration: 24h
      issuer: financeapp-bk-test
    # Credencial compartida de las rutas que no llevan JWT. En main no tienen default y el
    # contexto no arranca sin ellas; aqui van fijas y duplicadas en BasicMother, que es quien
    # las manda en las peticiones de la suite.
    basic:
      username: monitor-de-pruebas
      password: clave-basic-de-pruebas

app:
  timezone: America/Bogota

cors:
  allowed-origins: "*"

status:
  check-timeout: 2s

# Encendida, como en Cloud Run. La lista vive detras de un puerto que los tests mockean.
registro:
  admitidos:
    enabled: true

# Gemini apunta a un puerto sin escucha, como el r2dbc: ningun test de contexto llama a Google. El
# adapter se prueba contra su propio servidor falso (GeminiAssistantAdapterTest).
asistente:
  proveedor: gemini
  max-imagenes: 3
  gemini:
    api-key: clave-de-gemini-de-pruebas
    model: modelo-de-pruebas
    base-url: http://localhost:65535
    timeout: 2s

# Igual que Gemini: ningun test de contexto sale a la red. El adapter se prueba contra su propio
# servidor falso (ExchangeRateApiAdapterTest).
tasas:
  proveedor: exchangerate-api
  reintento-tras-fallo: 1h
  exchangerate-api:
    url: http://localhost:65535/v6/latest/USD
    timeout: 2s

# Igual que Gemini: ningun test de contexto sale a la red. El adapter se prueba contra su propio
# servidor de llaves (GoogleIdTokenVerifierAdapterTest).
google:
  proveedor: google
  client-id: cliente-de-pruebas.apps.googleusercontent.com
  jwks-uri: http://localhost:65535/oauth2/v3/certs
  timeout: 2s

# Igual que Gemini: ningun test de contexto sale a la red. El adapter se prueba contra su propio
# servidor falso (TelegramBotApiAdapterTest). El secreto esta duplicado en TelegramMother, que es
# quien lo manda en las peticiones de la suite.
telegram:
  proveedor: telegram
  bot-token: 123456:token-del-bot-de-pruebas
  webhook-secret: secreto-del-webhook-de-pruebas-0123456789
  base-url: http://localhost:65535
  timeout: 2s

# Apagado a proposito: el r2dbc de esta suite apunta a un puerto sin escucha, asi que el chequeo
# de arranque abortaria el contexto de todos los tests de integracion.
startup:
  db-check:
    enabled: false
    max-attempts: 3
    initial-backoff: 1ms
    timeout: 50ms

logging:
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

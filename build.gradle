plugins {
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

// Lo comun a los cuatro modulos (FA-148). Lo propio de cada uno, sus dependencias y el plugin de
// Spring Boot, que solo aplica app, esta en el build.gradle de su carpeta.
subprojects {
	apply plugin: 'java'
	apply plugin: 'jacoco'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.oscargabriel'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
		testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
		testCompileOnly 'org.projectlombok:lombok'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		testAnnotationProcessor 'org.projectlombok:lombok'
	}

	// El plugin de Spring Boot lo agrega solo donde se aplica, que es app. Sin el los controladores
	// de los demas modulos no saben el nombre de sus @RequestParam y @PathVariable.
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs << '-parameters'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}

	// Fijada, no heredada del plugin: la version tiene que entender bytecode de Java 25. 0.8.14 es
	// justo la que trae Gradle 9.7.1 hoy, asi que esto no cambia nada ahora y protege de un
	// downgrade de Gradle mas adelante.
	jacoco {
		toolVersion = '0.8.14'
	}
}
